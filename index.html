<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Dead Horizon 3D - 4000x4000 Survival RPG</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080a0c;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #f1f5f9;
    }

    #game-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* Top Left: Survival Bars & Map Info */
    #status-panel {
      position: absolute;
      top: 8px;
      left: 10px;
      background: rgba(10, 14, 18, 0.72);
      border-left: 3px solid #ef4444;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 175px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }

    .bar-track {
      flex: 1;
      height: 7px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease;
    }

    #hp-fill { background: #ef4444; }
    #hunger-fill { background: #f59e0b; }
    #thirst-fill { background: #38bdf8; }

    #map-info {
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
      margin-top: 2px;
    }

    #zone-label {
      color: #34d399;
      font-weight: 800;
    }

    /* Boss Health Bar (Top Center) */
    #boss-bar-wrap {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      background: rgba(20, 8, 12, 0.85);
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 5px 10px;
      display: none;
      text-align: center;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.45);
    }

    #boss-name {
      font-size: 11px;
      font-weight: 900;
      color: #fca5a5;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    #boss-hp-track {
      width: 100%;
      height: 8px;
      background: #271014;
      border-radius: 4px;
      overflow: hidden;
    }

    #boss-hp-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #dc2626, #f97316);
    }

    /* Top Right Buttons */
    #top-right-controls {
      position: absolute;
      top: 8px;
      right: 10px;
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .top-btn {
      background: rgba(15, 23, 30, 0.82);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 800;
    }

    .top-btn:active, .top-btn.active {
      background: #dc2626;
      border-color: #fff;
    }

    #btn-open-bag {
      background: rgba(217, 119, 6, 0.88);
      border-color: #fbbf24;
    }

    /* Crosshair & Interaction Prompt */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 4px #000;
    }

    #crosshair.highlight {
      border-color: #fbbf24;
      transform: translate(-50%, -50%) scale(1.4);
    }

    #ammo-hud {
      position: absolute;
      bottom: 68px;
      right: 165px;
      background: rgba(10, 14, 18, 0.72);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #fde047;
      display: none;
    }

    #target-prompt {
      position: absolute;
      top: calc(50% + 16px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 14, 18, 0.85);
      border: 1px solid rgba(251, 191, 36, 0.5);
      color: #fef08a;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      display: none;
      white-space: nowrap;
    }

    /* Toast Notifications */
    #toast-box {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .toast {
      background: rgba(15, 23, 20, 0.88);
      border: 1px solid #34d399;
      color: #6ee7b7;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      animation: fadeUp 1.1s ease-out forwards;
    }

    @keyframes fadeUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-18px); }
    }

    /* 8-Slot Bottom Hotbar (Item Baridag Bar) */
    #hotbar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: rgba(10, 14, 18, 0.78);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
    }

    .hotbar-slot {
      width: 44px;
      height: 46px;
      background: rgba(30, 41, 59, 0.75);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 16px;
    }

    .hotbar-slot.selected {
      border-color: #fbbf24;
      background: rgba(245, 158, 11, 0.28);
      transform: translateY(-2px);
    }

    .slot-name {
      font-size: 8px;
      font-weight: 700;
      max-width: 40px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #e2e8f0;
    }

    .slot-qty {
      position: absolute;
      top: 1px;
      right: 3px;
      font-size: 9px;
      font-weight: 900;
      color: #fde047;
    }

    /* Left Joystick */
    #joystick-zone {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 34%;
      height: 72%;
      pointer-events: auto;
    }

    #joystick-base {
      position: absolute;
      left: 26px;
      bottom: 28px;
      width: 102px;
      height: 102px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joystick-stick {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(241, 245, 249, 0.6);
      border: 2px solid #fff;
    }

    /* Right Camera Look Area */
    #look-zone {
      position: absolute;
      right: 0;
      top: 0;
      width: 66%;
      height: 100%;
      pointer-events: auto;
    }

    /* Right Action Buttons */
    #action-pad {
      position: absolute;
      right: 14px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(2, 58px);
      gap: 8px;
      pointer-events: none;
    }

    .act-btn {
      pointer-events: auto;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(15, 23, 30, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .act-btn:active, .act-btn.active {
      background: #ef4444;
      border-color: #fff;
      transform: scale(0.93);
    }

    #btn-use {
      background: rgba(220, 38, 38, 0.85);
      border-color: #fca5a5;
      font-size: 11px;
    }

    #btn-loot {
      background: rgba(16, 185, 129, 0.82);
      border-color: #6ee7b7;
    }

    /* ==========================================
       INVENTORY & 520-ITEM CRAFTING MODAL
       ========================================== */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(6, 9, 13, 0.92);
      pointer-events: auto;
      padding: 10px;
      flex-direction: column;
    }

    #modal-overlay.open {
      display: flex;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .modal-tabs {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
    }

    .tab-btn.active {
      background: #d97706;
      color: #fff;
      border-color: #fbbf24;
    }

    #btn-close-modal {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 12px;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      touch-action: pan-y;
      padding-right: 4px;
    }

    .modal-body * {
      touch-action: pan-y;
    }

    /* Filter Bar for 520 Crafts */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 8px;
    }

    #craft-search {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      width: 160px;
      user-select: text;
      -webkit-user-select: text;
    }

    .cat-pill {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
    }

    .cat-pill.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }

    .grid-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 6px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 6px;
      padding: 7px 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 800;
      color: #f8fafc;
    }

    .card-sub {
      font-size: 10px;
      color: #94a3b8;
    }

    .card-btn {
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .card-btn.disabled {
      background: #334155;
      color: #64748b;
    }

    .card-btn.equip {
      background: #2563eb;
    }

    /* Portrait Warning */
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #090b0c;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    @media screen and (orientation: portrait) {
      #rotate-overlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="rotate-overlay">
    <div>
      <h2 style="color:#ef4444; margin-bottom:8px;">УТСАА ХЭВТҮҮЛНЭ ҮҮ</h2>
      <p style="color:#94a3b8; font-size:14px;">4000x4000 ертөнц болон 520 crafting цэсийг ашиглахын тулд утсаа хэвтээ болгоно уу.</p>
    </div>
  </div>

  <!-- MAIN HUD -->
  <div id="hud">
    <div id="status-panel">
      <div class="bar-row">❤️ <div class="bar-track"><div id="hp-fill" class="bar-fill"></div></div> <span id="hp-text">100</span></div>
      <div class="bar-row">🍖 <div class="bar-track"><div id="hunger-fill" class="bar-fill"></div></div> <span id="hunger-text">100</span></div>
      <div class="bar-row">💧 <div class="bar-track"><div id="thirst-fill" class="bar-fill"></div></div> <span id="thirst-text">100</span></div>
      <div id="map-info">
        <span id="zone-label">SAFE ZONE</span> | <span id="coord-label">X:0 Z:0</span> | <span id="fps-label">60 FPS</span>
      </div>
    </div>

    <!-- Active Boss Health Bar -->
    <div id="boss-bar-wrap">
      <div id="boss-name">BOSS ZOMBIE</div>
      <div id="boss-hp-track"><div id="boss-hp-fill"></div></div>
    </div>

    <!-- Top Right Buttons -->
    <div id="top-right-controls">
      <button id="btn-open-bag" class="top-btn" type="button">🎒 ЦҮНХ / CRAFT (520)</button>
      <button id="btn-light" class="top-btn active" type="button">🔦</button>
      <button id="btn-fs" class="top-btn" type="button">⛶</button>
    </div>

    <div id="crosshair"></div>
    <div id="target-prompt">Хайрцаг нээх [LOOT]</div>
    <div id="ammo-hud">СУМ: 15 / 60</div>
    <div id="toast-box"></div>

    <!-- 8-Slot Quick Equip Hotbar -->
    <div id="hotbar"></div>

    <!-- Left Touch Joystick -->
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>

    <!-- Right Camera Look Area -->
    <div id="look-zone"></div>

    <!-- Right Thumb Action Buttons -->
    <div id="action-pad">
      <button id="btn-loot" class="act-btn" type="button">📦 LOOT<br/>АВАХ</button>
      <button id="btn-use" class="act-btn" type="button">🔥 FIRE<br/>ХЭРЭГЛЭХ</button>
      <button id="btn-reload" class="act-btn" type="button">🔄<br/>RELOAD</button>
      <button id="btn-jump" class="act-btn" type="button">⬆️<br/>JUMP</button>
      <button id="btn-sprint" class="act-btn" type="button">⚡<br/>SPRINT</button>
      <button id="btn-crouch" class="act-btn" type="button">⬇️<br/>CROUCH</button>
    </div>
  </div>

  <!-- INVENTORY, 520 CRAFTING & 40 ZOMBIES MODAL -->
  <div id="modal-overlay">
    <div class="modal-header">
      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="craft">🔨 УРЛАХ (520 ЖОР)</button>
        <button class="tab-btn" data-tab="inv">🎒 МИНИЙ ЦҮНХ</button>
        <button class="tab-btn" data-tab="zombies">🧟 20 ЗОМБИ + 20 BOSS</button>
      </div>
      <button id="btn-close-modal" type="button">✕ ХААХ</button>
    </div>
    <div id="modal-content" class="modal-body"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================
    // 1. COMPLETE GAME DATABASE: 520 CRAFTABLES, 20 ZOMBIES, 20 BOSSES
    // =========================================================
    class GameCatalog {
      static init() {
        this.items = {};
        this.recipes = [];

        // Base Gatherable & Lootable Resources
        const rawMaterials = [
          { id: 'wood', name: 'Мод (Wood)', icon: '🪵', cat: 'Material', desc: 'Ой модноос цавчиж авна' },
          { id: 'stone', name: 'Чулуу (Stone)', icon: '🪨', cat: 'Material', desc: 'Хад чулуунаас олборлоно' },
          { id: 'iron_ore', name: 'Төмрийн Хүдэр', icon: '⛏️', cat: 'Material', desc: 'Агуй болон уулаас олно' },
          { id: 'copper_ore', name: 'Зэсийн Хүдэр', icon: '🟠', cat: 'Material', desc: 'Цахилгаан хэрэгсэлд орно' },
          { id: 'sulfur', name: 'Хүхэр (Sulfur)', icon: '🟡', cat: 'Material', desc: 'Дарь хийхэд ашиглана' },
          { id: 'titanium_ore', name: 'Титан Хүдэр', icon: '💠', cat: 'Material', desc: 'Ховор хүдэр' },
          { id: 'cloth', name: 'Даавуу (Cloth)', icon: '🧵', cat: 'Material', desc: 'Бинт, хувцас хийнэ' },
          { id: 'scrap_metal', name: 'Хаягдал Төмөр', icon: '⚙️', cat: 'Material', desc: 'Хотын хайрцагнаас олно' },
          { id: 'chemical', name: 'Химийн Бодис', icon: '🧪', cat: 'Material', desc: 'Эм, тэсрэх бөмбөгөнд орно' },
          { id: 'zombie_blood', name: 'Зомбигийн Цус', icon: '🩸', cat: 'Material', desc: 'Зомби устгахад унана' },
          { id: 'mutant_gland', name: 'Мутант Булчирхай', icon: '🧬', cat: 'Material', desc: 'Тусгай зомбиноос унана' },
          { id: 'boss_core', name: 'BOSS Цөм (Core)', icon: '🔮', cat: 'Material', desc: 'Boss устгахад унадаг хүчирхэг цөм' },
          { id: 'dirty_water', name: 'Түүхий Ус', icon: '🫗', cat: 'Survival', desc: 'Цэвэршүүлж ууна' },
          { id: 'raw_meat', name: 'Түүхий Мах', icon: '🥩', cat: 'Survival', desc: 'Шарж иднэ' }
        ];

        for (const m of rawMaterials) {
          this.items[m.id] = m;
        }

        // Helper to register both Item and Crafting Recipe
        const addCraft = (id, name, icon, cat, desc, reqs, outQty = 1, props = {}) => {
          this.items[id] = { id, name, icon, cat, desc, ...props };
          this.recipes.push({ id, name, icon, cat, desc, reqs, outQty });
        };

        // --- A. REFINED MATERIALS & PARTS (45 items) ---
        addCraft('wood_plank', 'Модон Банз', '🪚', 'Material', 'Барилга, зэвсгийн иш', { wood: 2 }, 4);
        addCraft('cut_stone', 'Зассан Чулуу', '🧱', 'Material', 'Чулуун барилгын материал', { stone: 2 }, 3);
        addCraft('iron_ingot', 'Төмөр Гулдмай', '🔩', 'Material', 'Хайлуулсан цэвэр төмөр', { iron_ore: 2, wood: 1 }, 2);
        addCraft('copper_wire', 'Зэс Утас', '➰', 'Material', 'Электроник холбоос', { copper_ore: 1 }, 4);
        addCraft('steel_ingot', 'Ган Гулдмай', '🛡️', 'Material', 'Бат бөх ган хайлш', { iron_ingot: 2, scrap_metal: 2 }, 1);
        addCraft('titanium_ingot', 'Титан Хайлш', '💎', 'Material', 'Хамгийн бат бөх металл', { titanium_ore: 2, steel_ingot: 1 }, 1);
        addCraft('gunpowder', 'Дарь (Gunpowder)', '💥', 'Material', 'Бүх төрлийн суманд орно', { sulfur: 1, wood: 1 }, 5);
        addCraft('rope', 'Олс (Rope)', '🪢', 'Material', 'Бэхэлгээний олс', { cloth: 3 }, 2);
        addCraft('glue', 'Цавуу (Adhesive)', '🧴', 'Material', 'Эд анги наах цавуу', { chemical: 1, zombie_blood: 1 }, 2);
        addCraft('circuit', 'Цахилгаан Хавтан', '📟', 'Material', 'Автомат цамхагт орно', { copper_wire: 3, scrap_metal: 2 }, 1);
        addCraft('gun_barrel', 'Бууны Гол Төмөр', '🦯', 'Material', 'Галт зэвсгийн үндсэн эд анги', { steel_ingot: 2 }, 1);
        addCraft('gun_stock', 'Бууны Мөрлөгч', '🪵', 'Material', 'Бууны бариул', { wood_plank: 3, glue: 1 }, 1);
        addCraft('spring', 'Пүрш (Spring)', '🌀', 'Material', 'Бууны замгийн пүрш', { scrap_metal: 2 }, 2);
        addCraft('glass', 'Шил (Glass)', '🪟', 'Material', 'Дуран болон цонхонд орно', { stone: 3 }, 2);
        addCraft('charcoal', 'Нүүрс (Charcoal)', '⚫', 'Material', 'Шатсан модны нүүрс', { wood: 2 }, 3);

        // Generate 30 Industrial Alloys & Mechanical Parts to reach 45 Materials
        const partPrefixes = ['Хөнгөн', 'Хүнд', 'Цэргийн', 'Сайжруулсан', 'Титан', 'Нано'];
        const partNouns = ['Араа', 'Хоолой', 'Хуудас', 'Түгжээ', 'Хөдөлгүүр'];
        let pIdx = 1;
        for (const pre of partPrefixes) {
          for (const noun of partNouns) {
            addCraft(
              `part_${pIdx}`,
              `${pre} ${noun}`,
              '🔧',
              'Material',
              `Үйлдвэрлэлийн эд анги #${pIdx}`,

              1

    GameCatalog.init();

    // =========================================================
    // 2. SEEDED RANDOM & 4000x4000 CHUNK STREAMING OPEN WORLD
    // =========================================================
    class ChunkWorld {
      constructor(scene) {
        this.scene = scene;
        this.worldHalf = 2000; // -2000 to +2000 = 4000x4000 meters
        this.chunkSize = 80;
        this.viewRadius = 2; // 5x5 chunks = 400m x 400m active around player

        this.chunks = new Map();
        this.colliders = [];
        this.gatherables = [];
        this.lootCrates = [];
        this.playerStructures = [];
        this.particles = [];

        this.setupMaterials();
        this.buildSafeZoneHub();
      }

      setupMaterials() {
        const makeTex = (rgb, grain, rep) => {
          const c = document.createElement('canvas');
          c.width = 128; c.height = 128;
          const ctx = c.getContext('2d');
          ctx.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
          ctx.fillRect(0, 0, 128, 128);
          for (let i = 0; i < 900; i++) {
            const d = (Math.random() - 0.5) * grain;
            ctx.fillStyle = `rgb(${Math.max(0, Math.min(255, rgb[0] + d)) | 0},${Math.max(0, Math.min(255, rgb[1] + d)) | 0},${Math.max(0, Math.min(255, rgb[2] + d)) | 0})`;
            ctx.fillRect(Math.random() * 128, Math.random() * 128, 3, 3);
          }
          const t = new THREE.CanvasTexture(c);
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(rep, rep);
          return t;
        };

        this.matGround = new THREE.MeshStandardMaterial({ map: makeTex([68, 76, 58], 35, 16), roughness: 0.95 });
        this.matCityGround = new THREE.MeshStandardMaterial({ map: makeTex([48, 52, 56], 28, 16), roughness: 0.92 });
        this.matConcrete = new THREE.MeshStandardMaterial({ map: makeTex([92, 98, 96], 30, 3), roughness: 0.88 });
        this.matBark = new THREE.MeshStandardMaterial({ map: makeTex([76, 52, 34], 35, 2), roughness: 0.9 });
        this.matLeaves = new THREE.MeshStandardMaterial({ map: makeTex([38, 72, 42], 32, 2), roughness: 0.85 });
        this.matRock = new THREE.MeshStandardMaterial({ map: makeTex([104, 108, 114], 40, 2), roughness: 0.86 });
        this.matOre = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.45, roughness: 0.3, metalness: 0.8 });
        this.matLoot = new THREE.MeshStandardMaterial({ color: 0xd97706, emissive: 0x92400e, emissiveIntensity: 0.35, roughness: 0.4, metalness: 0.6 });
      }

      // Deterministic PRNG per chunk
      rng(seed) {
        let s = seed | 0;
        return () => {
          s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      getTerrainHeight(x, z) {
        const dist0 = Math.hypot(x, z);
        if (dist0 < 28) return 0;
        const blend = Math.min(1, (dist0 - 28) / 30);
        const h =
          Math.sin(x * 0.018) * Math.cos(z * 0.018) * 5.2 +
          Math.sin(x * 0.045 + z * 0.035) * 1.8;
        return Math.max(-1.5, h * blend);
      }

      getBiomeAt(x, z) {
        if (Math.hypot(x, z) < 30) return 'SAFE ZONE';
        const val = Math.sin(x * 0.0045) + Math.cos(z * 0.0045);
        if (val > 0.85) return 'ABANDONED CITY';
        if (val < -0.85) return 'MOUNTAIN MINES & CAVES';
        if (Math.sin(x * 0.009 - z * 0.007) > 0.35) return 'DENSE FOREST';
        return 'WASTELAND VILLAGE';
      }

      buildSafeZoneHub() {
        // Starter Safe Zone Perimeter at (0, 0)
        const wall = (x, z, w, d) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, 3, d), this.matConcrete);
          m.position.set(x, 1.5, z);
          m.castShadow = true;
          m.receiveShadow = true;
          this.scene.add(m);
          this.colliders.push({ minX: x - w / 2, maxX: x + w / 2, minY: 0, maxY: 3, minZ: z - d / 2, maxZ: z + d / 2, permanent: true });
        };
        wall(0, 16, 30, 0.8);
        wall(-15, 0, 0.8, 32);
        wall(15, 0, 0.8, 32);
        wall(-9, -16, 12, 0.8);
        wall(9, -16, 12, 0.8);

        const beacon = new THREE.PointLight(0x34d399, 4, 28);
        beacon.position.set(0, 4.5, -16);
        this.scene.add(beacon);
      }

      updateChunks(playerPos) {
        const pcx = Math.floor(playerPos.x / this.chunkSize);
        const pcz = Math.floor(playerPos.z / this.chunkSize);
        const neededKeys = new Set();

        for (let dx = -this.viewRadius; dx <= this.viewRadius; dx++) {
          for (let dz = -this.viewRadius; dz <= this.viewRadius; dz++) {
            const cx = pcx + dx;
            const cz = pcz + dz;
            const centerX = (cx + 0.5) * this.chunkSize;
            const centerZ = (cz + 0.5) * this.chunkSize;
            if (Math.abs(centerX) > this.worldHalf || Math.abs(centerZ) > this.worldHalf) continue;

            const key = `${cx},${cz}`;
            neededKeys.add(key);
            if (!this.chunks.has(key)) {
              this.loadChunk(cx, cz, key);
            }
          }
        }

        // Unload distant chunks to keep mobile RAM low
        for (const [key, chunk] of this.chunks.entries()) {
          if (!neededKeys.has(key)) {
            this.unloadChunk(key, chunk);
          }
        }
      }

      loadChunk(cx, cz, key) {
        const group = new THREE.Group();
        const chunkColliders = [];
        const chunkGatherables = [];
        const chunkCrates = [];

        const startX = cx * this.chunkSize;
        const startZ = cz * this.chunkSize;
        const midX = startX + this.chunkSize / 2;
        const midZ = startZ + this.chunkSize / 2;
        const biome = this.getBiomeAt(midX, midZ);

        // 1. Chunk Terrain Patch
        const segs = 12;
        const geo = new THREE.PlaneGeometry(this.chunkSize, this.chunkSize, segs, segs);
        geo.rotateX(-Math.PI / 2);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const wx = pos.getX(i) + midX;
          const wz = pos.getZ(i) + midZ;
          pos.setY(i, this.getTerrainHeight(wx, wz));
        }
        geo.computeVertexNormals();
        const ground = new THREE.Mesh(
          geo,
          biome === 'ABANDONED CITY' ? this.matCityGround : this.matGround
        );
        ground.position.set(midX, 0, midZ);
        ground.receiveShadow = true;
        group.add(ground);

        // Deterministic Random for this chunk
        const rand = this.rng(cx * 73856093 ^ cz * 19349663);

        // Skip spawning obstacles inside Safe Zone center
        if (Math.hypot(midX, midZ) >= 24) {
          // 2. Spawn Buildings in City / Village
          const buildingCount = biome === 'ABANDONED CITY' ? 3 : biome === 'WASTELAND VILLAGE' ? 1 : 0;
          for (let b = 0; b < buildingCount; b++) {
            const bx = startX + 12 + rand() * (this.chunkSize - 24);
            const bz = startZ + 12 + rand() * (this.chunkSize - 24);
            const bw = 9 + rand() * 8;
            const bd = 9 + rand() * 8;
            const bh = biome === 'ABANDONED CITY' ? 10 + rand() * 14 : 4.5 + rand() * 3;
            const by = this.getTerrainHeight(bx, bz);

            const bMesh = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), this.matConcrete);
            bMesh.position.set(bx, by + bh / 2, bz);
            bMesh.castShadow = true;
            bMesh.receiveShadow = true;
            group.add(bMesh);

            const col = { minX: bx - bw / 2, maxX: bx + bw / 2, minY: by, maxY: by + bh, minZ: bz - bd / 2, maxZ: bz + bd / 2 };
            chunkColliders.push(col);
            this.colliders.push(col);

            // Spawn a Loot Crate beside every building
            this.spawnLootCrate(bx + bw / 2 + 1.4, bz, group, chunkCrates);
          }

          // 3. Spawn Trees
          const treeCount = biome === 'DENSE FOREST' ? 12 : biome === 'ABANDONED CITY' ? 2 : 5;
          for (let t = 0; t < treeCount; t++) {
            const tx = startX + 4 + rand() * (this.chunkSize - 8);
            const tz = startZ + 4 + rand() * (this.chunkSize - 8);
            const ty = this.getTerrainHeight(tx, tz);
            const sc = 0.8 + rand() * 0.5;

            const tree = new THREE.Group();
            tree.position.set(tx, ty, tz);
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.24 * sc, 0.35 * sc, 3.2 * sc, 6), this.matBark);
            trunk.position.y = 1.6 * sc;
            trunk.castShadow = true;
            tree.add(trunk);

            const crown = new THREE.Mesh(new THREE.ConeGeometry(1.7 * sc, 3.8 * sc, 6), this.matLeaves);
            crown.position.y = 4.2 * sc;
            crown.castShadow = true;
            tree.add(crown);
            group.add(tree);

            const col = { minX: tx - 0.45, maxX: tx + 0.45, minY: ty, maxY: ty + 5, minZ: tz - 0.45, maxZ: tz + 0.45 };
            chunkColliders.push(col);
            this.colliders.push(col);

            const gItem = {
              type: 'wood',
              label: 'Мод (Wood)',
              mesh: tree,
              hitTarget: trunk,
              collider: col,
              pos: new THREE.Vector3(tx, ty + 1.4, tz),
              hp: 60,
              maxHp: 60
            };
            chunkGatherables.push(gItem);
            this.gatherables.push(gItem);
          }

          // 4. Spawn Rocks & Ores
          const rockCount = biome === 'MOUNTAIN MINES & CAVES' ? 8 : 3;
          for (let r = 0; r < rockCount; r++) {
            const rx = startX + 5 + rand() * (this.chunkSize - 10);
            const rz = startZ + 5 + rand() * (this.chunkSize - 10);
            const ry = this.getTerrainHeight(rx, rz);
            const oreRoll = rand();
            let resType = 'stone';
            let resLabel = 'Чулуу (Stone)';
            if (oreRoll > 0.72) { resType = 'titanium_ore'; resLabel = 'Титан Хүдэр'; }
            else if (oreRoll > 0.48) { resType = 'iron_ore'; resLabel = 'Төмрийн Хүдэр'; }
            else if (oreRoll > 0.34) { resType = 'sulfur'; resLabel = 'Хүхэр (Sulfur)'; }
            else if (oreRoll > 0.22) { resType = 'copper_ore'; resLabel = 'Зэсийн Хүдэр'; }

            const rock = new THREE.Mesh(
              new THREE.DodecahedronGeometry(1.05, 0),
              resType === 'stone' ? this.matRock : this.matOre
            );
            rock.position.set(rx, ry + 0.65, rz);
            rock.castShadow = true;
            group.add(rock);

            const col = { minX: rx - 0.9, maxX: rx + 0.9, minY: ry, maxY: ry + 1.4, minZ: rz - 0.9, maxZ: rz + 0.9 };
            chunkColliders.push(col);
            this.colliders.push(col);

            const gItem = {
              type: resType,
              label: resLabel,
              mesh: rock,
              hitTarget: rock,
              collider: col,
              pos: new THREE.Vector3(rx, ry + 0.7, rz),
              hp: 75,
              maxHp: 75
            };
            chunkGatherables.push(gItem);
            this.gatherables.push(gItem);
          }

          // 5. Random Wilderness Loot Crate
          if (rand() > 0.45) {
            this.spawnLootCrate(midX + (rand() - 0.5) * 30, midZ + (rand() - 0.5) * 30, group, chunkCrates);
          }
        } else {
          // Starter Loot Crate inside Safe Zone
          this.spawnLootCrate(5, -5, group, chunkCrates);
        }

        this.scene.add(group);
        this.chunks.set(key, { group, chunkColliders, chunkGatherables, chunkCrates });
      }

      spawnLootCrate(x, z, parentGroup, chunkCrates) {
        const y = this.getTerrainHeight(x, z);
        const crate = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.85, 0.85), this.matLoot);
        crate.position.set(x, y + 0.42, z);
        crate.castShadow = true;
        parentGroup.add(crate);

        const data = { mesh: crate, pos: new THREE.Vector3(x, y + 0.5, z), opened: false };
        chunkCrates.push(data);
        this.lootCrates.push(data);
      }

      unloadChunk(key, chunk) {
        this.scene.remove(chunk.group);
        this.colliders = this.colliders.filter((c) => !chunk.chunkColliders.includes(c));
        this.gatherables = this.gatherables.filter((g) => !chunk.chunkGatherables.includes(g));
        this.lootCrates = this.lootCrates.filter((l) => !chunk.chunkCrates.includes(l));
        this.chunks.delete(key);
      }

      placePlayerBuilding(pos, yaw, itemDef) {
        const grid = 3.0;
        const bx = Math.round(pos.x / grid) * grid;
        const bz = Math.round(pos.z / grid) * grid;
        const by = this.getTerrainHeight(bx, bz);

        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(itemDef.w, itemDef.h, itemDef.d),
          new THREE.MeshStandardMaterial({ color: itemDef.color, roughness: 0.75, metalness: 0.25 })
        );
        mesh.position.set(bx, by + itemDef.h / 2, bz);
        // Snap rotation to 90 degrees
        const snappedRot = Math.round(yaw / (Math.PI / 2)) * (Math.PI / 2);
        mesh.rotation.y = snappedRot;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        this.scene.add(mesh);

        const col = {
          minX: bx - itemDef.w / 2,
          maxX: bx + itemDef.w / 2,
          minY: by,
          maxY: by + itemDef.h,
          minZ: bz - itemDef.d / 2,
          maxZ: bz + itemDef.d / 2
        };
        this.colliders.push(col);

        this.playerStructures.push({
          mesh,
          pos: new THREE.Vector3(bx, by + itemDef.h / 2, bz),
          hp: itemDef.hp,
          isTurret: itemDef.isTurret,
          cooldown: 0
        });
      }

      spawnBurst(pos, hex) {
        const mat = new THREE.MeshBasicMaterial({ color: hex });
        const geo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
        for (let i = 0; i < 6; i++) {
          const p = new THREE.Mesh(geo, mat);
          p.position.copy(pos);
          this.scene.add(p);
          this.particles.push({
            mesh: p,
            vel: new THREE.Vector3((Math.random() - 0.5) * 4, 2 + Math.random() * 3, (Math.random() - 0.5) * 4),
            life: 0.45
          });
        }
      }

      update(dt, zombieMgr) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            this.scene.remove(p.mesh);
            this.particles.splice(i, 1);
          } else {
            p.vel.y -= 12 * dt;
            p.mesh.position.addScaledVector(p.vel, dt);
          }
        }

        // Auto-Turrets shoot nearby zombies automatically
        for (const st of this.playerStructures) {
          if (!st.isTurret) continue;
          st.cooldown -= dt;
          if (st.cooldown <= 0 && zombieMgr.zombies.length > 0) {
            const target = zombieMgr.findNearest(st.pos, 22);
            if (target) {
              st.cooldown = 0.6;
              zombieMgr.damageZombie(target, 45);
              this.spawnBurst(target.group.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 0xfacc15);
            }
          }
        }
      }
    }

    // =========================================================
    // 3. 20 ZOMBIES + 20 BOSS ZOMBIES AI & COMBAT MANAGER
    // =========================================================
    class ZombieManager {
      constructor(scene, world) {
        this.scene = scene;
        this.world = world;
        this.zombies = [];
        this.spawnTimer = 0;
        this.bossTimer = 18; // First Boss spawns shortly after leaving Safe Zone
      }

      createZombieMesh(def, isBoss) {
        const group = new THREE.Group();
        const s = def.scale;

        const bodyMat = new THREE.MeshStandardMaterial({ color: def.bodyCol, roughness: 0.85 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.9 });
        const eyeMat = new THREE.MeshBasicMaterial({ color: def.eyeCol });

        // Torso
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62 * s, 0.85 * s, 0.34 * s), bodyMat);
        torso.position.y = 1.05 * s;
        torso.castShadow = true;
        group.add(torso);

        // Head
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.42 * s, 0.42 * s, 0.42 * s), skinMat);
        head.position.y = 1.72 * s;
        head.castShadow = true;
        group.add(head);

        // Glowing Eyes
        const eyeGeo = new THREE.BoxGeometry(0.08 * s, 0.06 * s, 0.05 * s);
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(-0.1 * s, 1.75 * s, 0.21 * s);
        const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeR.position.set(0.1 * s, 1.75 * s, 0.21 * s);
        group.add(eyeL, eyeR);

        // Outstretched Zombie Arms
        const armGeo = new THREE.BoxGeometry(0.18 * s, 0.18 * s, 0.72 * s);
        const armL = new THREE.Mesh(armGeo, skinMat);
        armL.position.set(-0.42 * s, 1.28 * s, 0.32 * s);
        const armR = new THREE.Mesh(armGeo, skinMat);
        armR.position.set(0.42 * s, 1.28 * s, 0.32 * s);
        group.add(armL, armR);

        // Boss Crown / Spikes + Aura Light
        if (isBoss) {
          const crown = new THREE.Mesh(
            new THREE.ConeGeometry(0.35 * s, 0.55 * s, 5),
            new THREE.MeshBasicMaterial({ color: def.eyeCol })
          );
          crown.position.y = 2.15 * s;
          group.add(crown);

          const aura = new THREE.PointLight(def.eyeCol, 3.5, 14);
          aura.position.y = 1.8 * s;
          group.add(aura);
        }

        // Invisible Hitbox for Easy Raycast Aiming
        const hitbox = new THREE.Mesh(
          new THREE.BoxGeometry(0.95 * s, 2.1 * s, 0.95 * s),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        hitbox.position.y = 1.05 * s;
        group.add(hitbox);

        return { group, hitbox, armL, armR };
      }

      spawnZombie(playerPos, isBoss = false) {
        const pool = isBoss ? GameCatalog.bossTypes : GameCatalog.zombieTypes;
        const def = pool[Math.floor(Math.random() * pool.length)];

        const angle = Math.random() * Math.PI * 2;
        const dist = isBoss ? 34 : 22 + Math.random() * 35;
        const sx = Math.max(-1980, Math.min(1980, playerPos.x + Math.cos(angle) * dist));
        const sz = Math.max(-1980, Math.min(1980, playerPos.z + Math.sin(angle) * dist));

        // Never spawn inside Safe Zone
        if (Math.hypot(sx, sz) < 22) return null;

        const sy = this.world.getTerrainHeight(sx, sz);
        const rig = this.createZombieMesh(def, isBoss);
        rig.group.position.set(sx, sy, sz);
        this.scene.add(rig.group);

        const zObj = {
          def,
          isBoss,
          hp: def.hp,
          maxHp: def.hp,
          group: rig.group,
          hitbox: rig.hitbox,
          armL: rig.armL,
          armR: rig.armR,
          attackCooldown: 0,
          animTimer: Math.random() * 10
        };
        this.zombies.push(zObj);
        return zObj;
      }

      findNearest(pos, maxDist) {
        let best = null;
        let bestD = maxDist;
        for (const z of this.zombies) {
          const d = z.group.position.distanceTo(pos);
          if (d < bestD) {
            bestD = d;
            best = z;
          }
        }
        return best;
      }

      damageZombie(z, amount) {
        z.hp -= amount;
        this.world.spawnBurst(z.group.position.clone().add(new THREE.Vector3(0, 1.2 * z.def.scale, 0)), 0xdc2626);
        if (z.hp <= 0) {
          this.scene.remove(z.group);
          this.zombies = this.zombies.filter((item) => item !== z);
          return true; // Killed
        }
        return false;
      }

      update(dt, playerPos, onPlayerHit, onBossAlert) {
        const playerInSafeZone = Math.hypot(playerPos.x, playerPos.z) < 17;

        // Maintain up to 18 active zombies nearby
        this.spawnTimer -= dt;
        if (this.spawnTimer <= 0 && this.zombies.length < 18 && !playerInSafeZone) {
          this.spawnTimer = 2.2;
          this.spawnZombie(playerPos, false);
        }

        // Spawn one of the 20 Boss Zombies periodically
        const hasBoss = this.zombies.some((z) => z.isBoss);
        if (!hasBoss && !playerInSafeZone) {
          this.bossTimer -= dt;
          if (this.bossTimer <= 0) {
            this.bossTimer = 45;
            const boss = this.spawnZombie(playerPos, true);
            if (boss && onBossAlert) onBossAlert(boss);
          }
        }

        for (let i = this.zombies.length - 1; i >= 0; i--) {
          const z = this.zombies[i];
          const zPos = z.group.position;
          const dist = zPos.distanceTo(playerPos);

          // Despawn if too far away
          if (dist > 110) {
            this.scene.remove(z.group);
            this.zombies.splice(i, 1);
            continue;
          }

          // Safe zone repels zombies
          if (Math.hypot(zPos.x, zPos.z) < 18) {
            zPos.x += (zPos.x >= 0 ? 1 : -1) * 4 * dt;
            continue;
          }

          // Face player & chase
          const dx = playerPos.x - zPos.x;
          const dz = playerPos.z - zPos.z;
          z.group.rotation.y = Math.atan2(dx, dz);

          const reach = 1.65 * z.def.scale;
          if (dist > reach) {
            const nx = dx / dist;
            const nz = dz / dist;
            zPos.x += nx * z.def.speed * dt;
            zPos.z += nz * z.def.speed * dt;
            zPos.y = this.world.getTerrainHeight(zPos.x, zPos.z);

            z.animTimer += dt * z.def.speed * 2.5;
            z.armL.rotation.x = Math.sin(z.animTimer) * 0.25;
            z.armR.rotation.x = -Math.sin(z.animTimer) * 0.25;
          } else {
            z.attackCooldown -= dt;
            if (z.attackCooldown <= 0) {
              z.attackCooldown = 1.15;
              onPlayerHit(z.def.dmg, z.def.name);
            }
          }
        }
      }
    }

    // =========================================================
    // 4. PLAYER, HOTBAR, INVENTORY & COMBAT CONTROLLER
    // =========================================================
    class PlayerSystem {
      constructor(camera, scene, world, zombieMgr) {
        this.camera = camera;
        this.scene = scene;
        this.world = world;
        this.zombieMgr = zombieMgr;

        // Position inside Safe Zone
        this.pos = new THREE.Vector3(0, 0, 5);
        this.vel = new THREE.Vector3(0, 0, 0);
        this.yaw = 0;
        this.pitch = 0;
        this.radius = 0.42;
        this.height = 1.72;
        this.isGrounded = false;
        this.isCrouching = false;

        // Survival Stats
        this.hp = 100;
        this.maxHp = 100;
        this.hunger = 100;
        this.thirst = 100;
        this.armor = 0;

        // Inventory Map: itemId -> count
        this.inventory = {
          tool_stone_axe: 1,
          tool_stone_pick: 1,
          gun_pistol_0: 1,
          ammo_9mm: 60,
          bandage: 4,
          build_wood_plank_wall: 6,
          wood: 12,
          stone: 10
        };

        // 8-Slot Hotbar (itemId or null)
        this.hotbar = [
          'gun_pistol_0',
          'tool_stone_axe',
          'tool_stone_pick',
          'bandage',
          'build_wood_plank_wall',
          null,
          null,
          null
        ];
        this.selectedSlot = 0;
        this.magAmmo = {}; // gunId -> loaded bullets
        this.fireCooldown = 0;
        this.swingTimer = 0;

        this.raycaster = new THREE.Raycaster();
        this.tracers = [];

        this.setupHeldRig();
        this.refreshHeldModel();
      }

      setupHeldRig() {
        this.rig = new THREE.Group();
        this.heldAnchor = new THREE.Group();
        this.heldAnchor.position.set(0.3, -0.26, -0.46);
        this.rig.add(this.heldAnchor);

        this.flashlight = new THREE.SpotLight(0xfff4d8, 3.2, 48, Math.PI / 4.2, 0.4, 1.0);
        this.flashlight.position.set(-0.2, -0.1, -0.2);
        this.flashlight.target.position.set(0, -0.1, -14);
        this.rig.add(this.flashlight, this.flashlight.target);

        this.camera.add(this.rig);
        this.scene.add(this.camera);

        // Translucent Ghost Box for Base Building Placement
        this.buildGhost = new THREE.Mesh(
          new THREE.BoxGeometry(3, 3, 0.4),
          new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.42, wireframe: false })
        );
        this.buildGhost.visible = false;
        this.scene.add(this.buildGhost);
      }

      getEquippedItem() {
        const id = this.hotbar[this.selectedSlot];
        if (!id || !this.inventory[id]) return null;
        return GameCatalog.items[id] || null;
      }

      refreshHeldModel() {
        while (this.heldAnchor.children.length > 0) {
          this.heldAnchor.remove(this.heldAnchor.children[0]);
        }
        const item = this.getEquippedItem();
        if (!item) return;

        const mat = new THREE.MeshStandardMaterial({ color: item.color || 0x94a3b8, roughness: 0.4, metalness: 0.6 });
        if (item.type === 'gun') {
          const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.45), mat);
          const grip = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.15, 0.08), mat);
          grip.position.set(0, -0.1, 0.12);
          this.heldAnchor.add(body, grip);
        } else if (item.type === 'building') {
          const block = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.22), mat);
          this.heldAnchor.add(block);
        } else {
          // Tool / Melee / Consumable
          const stick = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.45, 0.06), mat);
          stick.rotation.x = -0.35;
          this.heldAnchor.add(stick);
        }
      }

      addItem(id, qty = 1) {
        this.inventory[id] = (this.inventory[id] || 0) + qty;
        const item = GameCatalog.items[id];
        // Auto-assign to empty hotbar slot if equippable
        if (item && ['gun', 'melee', 'tool', 'building', 'consumable'].includes(item.type)) {
          if (!this.hotbar.includes(id)) {
            const emptyIdx = this.hotbar.indexOf(null);
            if (emptyIdx !== -1) this.hotbar[emptyIdx] = id;
          }
        }
        this.refreshHeldModel();
      }

      removeItem(id, qty = 1) {
        if (!this.inventory[id] || this.inventory[id] < qty) return false;
        this.inventory[id] -= qty;
        if (this.inventory[id] <= 0) {
          delete this.inventory[id];
          const hIdx = this.hotbar.indexOf(id);
          if (hIdx !== -1) this.hotbar[hIdx] = null;
        }
        this.refreshHeldModel();
        return true;
      }

      reloadGun(onToast) {
        const item = this.getEquippedItem();
        if (!item || item.type !== 'gun') return;
        const current = this.magAmmo[item.id] ?? item.magSize;
        const needed = item.magSize - current;
        if (needed <= 0) return;

        const avail = this.inventory[item.ammoType] || 0;
        if (avail <= 0) {
          onToast('❌ Сум дууссан байна! (Craft хийнэ үү)');
          return;
        }
        const load = Math.min(needed, avail);
        this.removeItem(item.ammoType, load);
        this.magAmmo[item.id] = current + load;
        onToast(`🔄 Цэнэглэлээ (+${load} сум)`);
      }

      useEquipped(onToast, onZombieKilled) {
        const item = this.getEquippedItem();
        if (!item) {
          // Bare hands punch
          this.swingTimer = 0.25;
          this.performMeleeOrGather(18, onToast, onZombieKilled);
          return;
        }

        if (item.type === 'gun') {
          if (this.fireCooldown > 0) return;
          if (this.magAmmo[item.id] === undefined) this.magAmmo[item.id] = item.magSize;
          if (this.magAmmo[item.id] <= 0) {
            this.reloadGun(onToast);
            return;
          }
          this.magAmmo[item.id]--;
          this.fireCooldown = item.fireRate;
          this.heldAnchor.position.z = -0.36; // Recoil kick
          this.pitch += 0.015; // Vertical recoil
          this.fireBullet(item.damage, onToast, onZombieKilled);
        } else if (item.type === 'melee' || item.type === 'tool') {
          if (this.swingTimer > 0) return;
          this.swingTimer = 0.28;
          this.performMeleeOrGather(item.damage || item.power || 25, onToast, onZombieKilled);
        } else if (item.type === 'building') {
          const placePos = this.getBuildPreviewPos();
          this.world.placePlayerBuilding(placePos, this.yaw, item);
          this.removeItem(item.id, 1);
          onToast(`🧱 ${item.name} баригдлаа!`);
        } else if (item.type === 'consumable') {
          this.hp = Math.min(this.maxHp, this.hp + (item.hp || 0));
          this.hunger = Math.min(100, Math.max(0, this.hunger + (item.hunger || 0)));
          this.thirst = Math.min(100, Math.max(0, this.thirst + (item.thirst || 0)));
          this.removeItem(item.id, 1);
          onToast(`✨ ${item.name} хэрэглэлээ!`);
        }
      }

      fireBullet(damage, onToast, onZombieKilled) {
        this.raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);
        this.raycaster.far = 140;

        // Visual Tracer Line
        const start = this.camera.position.clone().add(new THREE.Vector3(0, -0.1, 0));
        const dir = new THREE.Vector3();
        this.camera.getWorldDirection(dir);
        const end = start.clone().addScaledVector(dir, 60);

        const hitboxes = this.zombieMgr.zombies.map((z) => z.hitbox);
        const hits = this.raycaster.intersectObjects(hitboxes, false);
        if (hits.length > 0) {
          end.copy(hits[0].point);
          const zObj = this.zombieMgr.zombies.find((z) => z.hitbox === hits[0].object);
          if (zObj) {
            const killed = this.zombieMgr.damageZombie(zObj, damage);
            if (killed) onZombieKilled(zObj);
          }
        }

        const lineGeo = new THREE.BufferGeometry().setFromPoints([start, end]);
        const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xfef08a }));
        this.scene.add(line);
        this.tracers.push({ mesh: line, life: 0.08 });
      }

      performMeleeOrGather(power, onToast, onZombieKilled) {
        this.raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);
        this.raycaster.far = 4.0;

        // 1. Check Zombie Hit
        const zHits = this.raycaster.intersectObjects(this.zombieMgr.zombies.map((z) => z.hitbox), false);
        if (zHits.length > 0) {
          const zObj = this.zombieMgr.zombies.find((z) => z.hitbox === zHits[0].object);
          if (zObj) {
            const killed = this.zombieMgr.damageZombie(zObj, power);
            if (killed) onZombieKilled(zObj);
            return;
          }
        }

        // 2. Check Resource Gather (Tree / Stone / Ore)
        const activeG = this.world.gatherables.filter((g) => g.hp > 0);
        const gHits = this.raycaster.intersectObjects(activeG.map((g) => g.hitTarget), false);
        if (gHits.length > 0) {
          const res = activeG.find((g) => g.hitTarget === gHits[0].object);
          if (res) {
            res.hp -= power;
            this.world.spawnBurst(res.pos, 0xfbbf24);
            if (res.hp <= 0) {
              res.mesh.visible = false;
              res.collider.disabled = true;
              const yieldQty = 3 + Math.floor(Math.random() * 4);
              this.addItem(res.type, yieldQty);
              onToast(`+${yieldQty} ${res.label}`);
            } else {
              onToast(`⛏️ ${res.label} [${Math.max(0, res.hp)}/${res.maxHp}]`);
            }
          }
        }
      }

      tryLootNearby(onToast) {
        for (const crate of this.world.lootCrates) {
          if (!crate.opened && crate.pos.distanceTo(this.pos) < 3.6) {
            crate.opened = true;
            crate.mesh.material = new THREE.MeshStandardMaterial({ color: 0x334155 });

            // Roll 3 random loot drops
            const lootPool = [
              'scrap_metal', 'cloth', 'gunpowder', 'iron_ingot', 'steel_ingot',
              'chemical', 'ammo_9mm', 'ammo_556', 'ammo_12g', 'bandage', 'medkit',
              'gun_smg_1', 'gun_shotgun_1', 'gun_ar_2', 'melee_steel_ingot_4'
            ];
            for (let i = 0; i < 3; i++) {
              const pick = lootPool[Math.floor(Math.random() * lootPool.length)];
              const qty = pick.startsWith('ammo_') ? 15 : 2;
              this.addItem(pick, qty);
              const def = GameCatalog.items[pick];
              if (def) onToast(`📦 Олдлоо: +${qty} ${def.name}`);
            }
            return true;
          }
        }
        return false;
      }

      getBuildPreviewPos() {
        const fwd = new THREE.Vector3(-Math.sin(this.yaw), 0, -Math.cos(this.yaw));
        return this.pos.clone().addScaledVector(fwd, 3.6);
      }

      update(dt, input) {
        if (this.fireCooldown > 0) this.fireCooldown -= dt;
        this.heldAnchor.position.z += (-0.46 - this.heldAnchor.position.z) * Math.min(1, dt * 15);

        if (this.swingTimer > 0) {
          this.swingTimer -= dt;
          this.heldAnchor.rotation.x = -Math.sin((this.swingTimer / 0.28) * Math.PI) * 1.2;
        } else {
          this.heldAnchor.rotation.x = 0;
        }

        // Update tracers
        for (let i = this.tracers.length - 1; i >= 0; i--) {
          this.tracers[i].life -= dt;
          if (this.tracers[i].life <= 0) {
            this.scene.remove(this.tracers[i].mesh);
            this.tracers.splice(i, 1);
          }
        }

        // Survival Hunger & Thirst gradual drain
        this.hunger = Math.max(0, this.hunger - dt * 0.12);
        this.thirst = Math.max(0, this.thirst - dt * 0.16);
        if (this.hunger <= 0 || this.thirst <= 0) {
          this.hp = Math.max(1, this.hp - dt * 1.2);
        }

        // Camera Look
        this.yaw -= input.lookX;
        this.pitch = Math.max(-1.45, Math.min(1.45, this.pitch - input.lookY));

        // Movement
        this.isCrouching = input.crouch;
        const speed = this.isCrouching ? 2.8 : input.sprint ? 9.5 : 5.6;
        const fwdX = -Math.sin(this.yaw), fwdZ = -Math.cos(this.yaw);
        const rgtX = Math.cos(this.yaw), rgtZ = -Math.sin(this.yaw);

        const wishX = fwdX * -input.moveY + rgtX * input.moveX;
        const wishZ = fwdZ * -input.moveY + rgtZ * input.moveX;

        this.vel.x += (wishX * speed - this.vel.x) * Math.min(1, dt * 13);
        this.vel.z += (wishZ * speed - this.vel.z) * Math.min(1, dt * 13);

        if (input.jump && this.isGrounded) {
          this.vel.y = 7.8;
          this.isGrounded = false;
        }
        this.vel.y -= 21.0 * dt;

        // Move & World Bounds (-2000 to +2000)
        this.pos.x = Math.max(-1995, Math.min(1995, this.pos.x + this.vel.x * dt));
        this.resolveHorizontal('x');

        this.pos.z = Math.max(-1995, Math.min(1995, this.pos.z + this.vel.z * dt));
        this.resolveHorizontal('z');

        this.pos.y += this.vel.y * dt;
        this.resolveVertical();

        const eyeH = this.isCrouching ? 0.92 : 1.62;
        this.camera.position.set(this.pos.x, this.pos.y + eyeH, this.pos.z);
        this.camera.rotation.y = this.yaw;
        this.camera.rotation.x = this.pitch;

        // Update Building Ghost Preview
        const eq = this.getEquippedItem();
        if (eq && eq.type === 'building') {
          const p = this.getBuildPreviewPos();
          const gx = Math.round(p.x / 3) * 3;
          const gz = Math.round(p.z / 3) * 3;
          const gy = this.world.getTerrainHeight(gx, gz);
          this.buildGhost.visible = true;
          this.buildGhost.scale.set(eq.w / 3, eq.h / 3, eq.d / 0.4);
          this.buildGhost.position.set(gx, gy + eq.h / 2, gz);
          this.buildGhost.rotation.y = Math.round(this.yaw / (Math.PI / 2)) * (Math.PI / 2);
        } else {
          this.buildGhost.visible = false;
        }
      }

      resolveHorizontal(axis) {
        const feetY = this.pos.y + 0.18;
        const headY = this.pos.y + (this.isCrouching ? 1.0 : 1.72);
        for (const b of this.world.colliders) {
          if (b.disabled || headY <= b.minY || feetY >= b.maxY) continue;
          if (this.pos.x + this.radius > b.minX && this.pos.x - this.radius < b.maxX &&
              this.pos.z + this.radius > b.minZ && this.pos.z - this.radius < b.maxZ) {
            if (axis === 'x') {
              this.pos.x = this.vel.x > 0 ? b.minX - this.radius : b.maxX + this.radius;
              this.vel.x = 0;
            } else {
              this.pos.z = this.vel.z > 0 ? b.minZ - this.radius : b.maxZ + this.radius;
              this.vel.z = 0;
            }
          }
        }
      }

      resolveVertical() {
        this.isGrounded = false;
        const ty = this.world.getTerrainHeight(this.pos.x, this.pos.z);
        if (this.pos.y <= ty) {
          this.pos.y = ty;
          this.vel.y = 0;
          this.isGrounded = true;
        }
        for (const b of this.world.colliders) {
          if (b.disabled) continue;
          if (this.pos.x + 0.35 > b.minX && this.pos.x - 0.35 < b.maxX &&
              this.pos.z + 0.35 > b.minZ && this.pos.z - 0.35 < b.maxZ) {
            if (this.vel.y <= 0 && this.pos.y <= b.maxY && this.pos.y >= b.maxY - 0.45) {
              this.pos.y = b.maxY;
              this.vel.y = 0;
              this.isGrounded = true;
            }
          }
        }
      }
    }

    // =========================================================
    // 5. TOUCH INPUTS & UI MANAGER (HOTBAR, 520 CRAFTS, BESTIARY)
    // =========================================================
    class GameController {
      constructor() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x526675);
        this.scene.fog = new THREE.FogExp2(0x526675, 0.0075);

        this.camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 260);
        this.camera.rotation.order = 'YXZ';

        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('game-container').appendChild(this.renderer.domElement);

        this.hemi = new THREE.HemisphereLight(0xcbd5e1, 0x334155, 0.95);
        this.sun = new THREE.DirectionalLight(0xfff1d6, 1.5);
        this.sun.castShadow = true;
        this.sun.shadow.mapSize.set(1024, 1024);
        const d = 55;
        this.sun.shadow.camera.left = -d; this.sun.shadow.camera.right = d;
        this.sun.shadow.camera.top = d; this.sun.shadow.camera.bottom = -d;
        this.scene.add(this.hemi, this.sun, this.sun.target);

        this.world = new ChunkWorld(this.scene);
        this.zombieMgr = new ZombieManager(this.scene, this.world);
        this.player = new PlayerSystem(this.camera, this.scene, this.world, this.zombieMgr);

        this.input = { moveX: 0, moveY: 0, lookX: 0, lookY: 0, jump: false, crouch: false, sprint: false };
        this.joyId = null;
        this.lookId = null;
        this.lastLook = { x: 0, y: 0 };

        this.activeModalTab = 'craft';
        this.craftCategory = 'ALL';
        this.craftSearch = '';

        this.bindControls();
        this.renderHotbar();

        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        this.clock = new THREE.Clock();
        this.fpsFrames = 0;
        this.fpsTime = 0;
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
      }

      showToast(msg) {
        const box = document.getElementById('toast-box');
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        box.appendChild(el);
        if (box.children.length > 4) box.firstChild.remove();
        setTimeout(() => el.remove(), 1100);
      }

      bindControls() {
        const joyZone = document.getElementById('joystick-zone');
        const joyBase = document.getElementById('joystick-base');
        const joyStick = document.getElementById('joystick-stick');
        const lookZone = document.getElementById('look-zone');

        joyZone.addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (this.joyId !== null) return;
          const t = e.changedTouches[0];
          this.joyId = t.identifier;
          this.moveJoy(t.clientX, t.clientY, joyBase, joyStick);
        }, { passive: false });

        joyZone.addEventListener('touchmove', (e) => {
          e.preventDefault();
          for (const t of e.changedTouches) {
            if (t.identifier === this.joyId) this.moveJoy(t.clientX, t.clientY, joyBase, joyStick);
          }
        }, { passive: false });

        const endJoy = (e) => {
          for (const t of e.changedTouches) {
            if (t.identifier === this.joyId) {
              this.joyId = null;
              this.input.moveX = 0;
              this.input.moveY = 0;
              joyStick.style.transform = 'translate(0,0)';
            }
          }
        };
        joyZone.addEventListener('touchend', endJoy);
        joyZone.addEventListener('touchcancel', endJoy);

        lookZone.addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (this.lookId !== null) return;
          const t = e.changedTouches[0];
          this.lookId = t.identifier;
          this.lastLook = { x: t.clientX, y: t.clientY };
        }, { passive: false });

        lookZone.addEventListener('touchmove', (e) => {
          e.preventDefault();
          for (const t of e.changedTouches) {
            if (t.identifier === this.lookId) {
              this.input.lookX += (t.clientX - this.lastLook.x) * 0.0046;
              this.input.lookY += (t.clientY - this.lastLook.y) * 0.0046;
              this.lastLook = { x: t.clientX, y: t.clientY };
            }
          }
        }, { passive: false });

        const endLook = (e) => {
          for (const t of e.changedTouches) {
            if (t.identifier === this.lookId) this.lookId = null;
          }
        };
        lookZone.addEventListener('touchend', endLook);
        lookZone.addEventListener('touchcancel', endLook);

        const tap = (id, fn) => {
          const el = document.getElementById(id);
          el.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); fn(el); }, { passive: false });
          el.addEventListener('click', (e) => { e.stopPropagation(); fn(el); });
        };

        tap('btn-use', () => {
          this.player.useEquipped(
            (m) => this.showToast(m),
            (z) => this.handleZombieKilled(z)
          );
          this.renderHotbar();
        });

        tap('btn-reload', () => this.player.reloadGun((m) => this.showToast(m)));

        tap('btn-loot', () => {
          if (this.player.tryLootNearby((m) => this.showToast(m))) {
            this.renderHotbar();
          } else {
            this.showToast('Ойр хавьд Loot хайрцаг алга');
          }
        });

        tap('btn-jump', () => { this.input.jump = true; });
        tap('btn-crouch', (el) => {
          this.input.crouch = !this.input.crouch;
          el.classList.toggle('active', this.input.crouch);
        });
        tap('btn-sprint', (el) => {
          this.input.sprint = !this.input.sprint;
          el.classList.toggle('active', this.input.sprint);
        });
        tap('btn-light', (el) => {
          this.player.flashlight.visible = !this.player.flashlight.visible;
          el.classList.toggle('active', this.player.flashlight.visible);
        });
        tap('btn-fs', () => {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
          else document.exitFullscreen().catch(() => {});
        });

        // Open / Close Bag & 520-Craft Modal
        tap('btn-open-bag', () => {
          document.getElementById('modal-overlay').classList.add('open');
          this.renderModal();
        });
        tap('btn-close-modal', () => {
          document.getElementById('modal-overlay').classList.remove('open');
          this.renderHotbar();
        });

        document.querySelectorAll('.tab-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            this.activeModalTab = btn.dataset.tab;
            this.renderModal();
          });
        });
      }

      moveJoy(tx, ty, base, stick) {
        const r = base.getBoundingClientRect();
        let dx = tx - (r.left + r.width / 2);
        let dy = ty - (r.top + r.height / 2);
        const dist = Math.hypot(dx, dy);
        if (dist > 42) { dx = (dx / dist) * 42; dy = (dy / dist) * 42; }
        stick.style.transform = `translate(${dx}px, ${dy}px)`;
        this.input.moveX = Math.abs(dx / 42) < 0.12 ? 0 : dx / 42;
        this.input.moveY = Math.abs(dy / 42) < 0.12 ? 0 : dy / 42;
      }

      handleZombieKilled(z) {
        this.showToast(`💀 ${z.def.name} устгагдлаа!`);
        this.player.addItem('zombie_blood', 1);
        if (z.isBoss) {
          this.player.addItem('boss_core', 1);
          this.player.addItem('titanium_ore', 3);
          this.showToast('🔮 BOSS CORE + Титан уналаа!');
        } else if (Math.random() > 0.55) {
          this.player.addItem('mutant_gland', 1);
        }
        this.renderHotbar();
      }

      renderHotbar() {
        const bar = document.getElementById('hotbar');
        bar.innerHTML = '';
        for (let i = 0; i < 8; i++) {
          const slot = document.createElement('div');
          slot.className = 'hotbar-slot' + (i === this.player.selectedSlot ? ' selected' : '');
          const id = this.player.hotbar[i];
          const item = id ? GameCatalog.items[id] : null;
          const qty = id ? (this.player.inventory[id] || 0) : 0;

          if (item && qty > 0) {
            slot.innerHTML = `
              <span class="slot-qty">${qty}</span>
              <span>${item.icon}</span>
              <span class="slot-name">${item.name.split(' ')[0]}</span>
            `;
          } else {
            slot.innerHTML = `<span style="color:#475569;font-size:10px;">${i + 1}</span>`;
          }

          const selectSlot = (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.player.selectedSlot = i;
            this.player.refreshHeldModel();
            this.renderHotbar();
          };
          slot.addEventListener('touchstart', selectSlot, { passive: false });
          slot.addEventListener('click', selectSlot);
          bar.appendChild(slot);
        }
      }

      renderModal() {
        const container = document.getElementById('modal-content');
        if (this.activeModalTab === 'craft') {
          const cats = ['ALL', 'Weapon', 'Ammo', 'Building', 'Armor', 'Survival', 'Tool', 'Material'];
          const catNames = { ALL: 'Бүгд (520)', Weapon: 'Зэвсэг', Ammo: 'Сум', Building: 'Барилга', Armor: 'Хуяг', Survival: 'Эм/Хоол', Tool: 'Багаж', Material: 'Материал' };

          let html = `<div class="filter-bar">
            <input id="craft-search" type="text" placeholder="🔍 Нэрээр хайх..." value="${this.craftSearch}" />
            ${cats.map((c) => `<button class="cat-pill ${this.craftCategory === c ? 'active' : ''}" data-cat="${c}">${catNames[c]}</button>`).join('')}
          </div><div class="grid-list">`;

          const filtered = GameCatalog.recipes.filter((r) => {
            if (this.craftCategory !== 'ALL' && r.cat !== this.craftCategory) return false;
            if (this.craftSearch && !r.name.toLowerCase().includes(this.craftSearch.toLowerCase())) return false;
            return true;
          });

          // Render up to 120 matching cards smoothly for mobile scroll performance
          for (const rec of filtered.slice(0, 120)) {
            const reqEntries = Object.entries(rec.reqs);
            const canCraft = reqEntries.every(([rid, amt]) => (this.player.inventory[rid] || 0) >= amt);
            const reqText = reqEntries
              .map(([rid, amt]) => {
                const have = this.player.inventory[rid] || 0;
                const rName = GameCatalog.items[rid]?.name.split(' ')[0] || rid;
                return `${rName}: ${have}/${amt}`;
              })
              .join(' | ');

            html += `
              <div class="card">
                <div class="card-info">
                  <div class="card-title">${rec.icon} ${rec.name} (x${rec.outQty})</div>
                  <div class="card-sub">${reqText}</div>
                </div>
                <button class="card-btn ${canCraft ? '' : 'disabled'}" data-craft="${rec.id}">УРЛАХ</button>
              </div>
            `;
          }
          html += `</div>`;
          if (filtered.length > 120) {
            html += `<p style="text-align:center;color:#94a3b8;font-size:11px;margin-top:8px;">Нийт ${filtered.length} жор олдлоо. Хайлт эсвэл ангилал ашиглаж шүүнэ үү.</p>`;
          }
          container.innerHTML = html;

          const searchInput = document.getElementById('craft-search');
          searchInput.addEventListener('input', (e) => {
            this.craftSearch = e.target.value;
            this.renderModal();
            const inp = document.getElementById('craft-search');
            inp.focus();
            inp.setSelectionRange(inp.value.length, inp.value.length);
          });

          container.querySelectorAll('.cat-pill').forEach((p) => {
            p.addEventListener('click', () => {
              this.craftCategory = p.dataset.cat;
              this.renderModal();
            });
          });

          container.querySelectorAll('[data-craft]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const rec = GameCatalog.recipes.find((r) => r.id === btn.dataset.craft);
              if (!rec) return;
              const ok = Object.entries(rec.reqs).every(([rid, amt]) => (this.player.inventory[rid] || 0) >= amt);
              if (!ok) {
                this.showToast('❌ Материал хүрэлцэхгүй байна!');
                return;
              }
              for (const [rid, amt] of Object.entries(rec.reqs)) {
                this.player.removeItem(rid, amt);
              }
              this.player.addItem(rec.id, rec.outQty);
              this.showToast(`🔨 Урлалаа: ${rec.name}`);
              this.renderModal();
              this.renderHotbar();
            });
          });
        } else if (this.activeModalTab === 'inv') {
          let html = `<div class="grid-list">`;
          const entries = Object.entries(this.player.inventory);
          if (entries.length === 0) html += `<p>Цүнх хоосон байна.</p>`;
          for (const [id, qty] of entries) {
            const it = GameCatalog.items[id];
            if (!it) continue;
            const equippable = ['gun', 'melee', 'tool', 'building', 'consumable'].includes(it.type);
            html += `
              <div class="card">
                <div class="card-info">
                  <div class="card-title">${it.icon} ${it.name} (x${qty})</div>
                  <div class="card-sub">${it.desc || ''}</div>
                </div>
                ${equippable ? `<button class="card-btn equip" data-equip="${id}">ГАРТ БАРИХ</button>` : ''}
              </div>
            `;
          }
          html += `</div>`;
          container.innerHTML = html;

          container.querySelectorAll('[data-equip]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const id = btn.dataset.equip;
              this.player.hotbar[this.player.selectedSlot] = id;
              this.player.refreshHeldModel();
              this.renderHotbar();
              this.showToast(`✋ Гарт барилаа: ${GameCatalog.items[id].name}`);
            });
          });
        } else if (this.activeModalTab === 'zombies') {
          let html = `<h4 style="color:#fbbf24;margin-bottom:6px;">👑 20 ТӨРЛИЙН BOSS ZOMBIE</h4><div class="grid-list" style="margin-bottom:12px;">`;
          for (const b of GameCatalog.bossTypes) {
            html += `<div class="card" style="border-color:#dc2626;"><div class="card-info"><div class="card-title" style="color:#fca5a5;">${b.name}</div><div class="card-sub">HP: ${b.hp} | Хурд: ${b.speed} | Цохилт: ${b.dmg}</div></div></div>`;
          }
          html += `</div><h4 style="color:#34d399;margin-bottom:6px;">🧟 20 ТӨРЛИЙН ЭНГИЙН ЗОМБИ</h4><div class="grid-list">`;
          for (const z of GameCatalog.zombieTypes) {
            html += `<div class="card"><div class="card-info"><div class="card-title">${z.name}</div><div class="card-sub">HP: ${z.hp} | Хурд: ${z.speed} | Цохилт: ${z.dmg}</div></div></div>`;
          }
          html += `</div>`;
          container.innerHTML = html;
        }
      }

      loop() {
        requestAnimationFrame(this.loop);
        const dt = Math.min(this.clock.getDelta(), 0.05);

        // Stream 4000x4000 world chunks around player
        this.world.updateChunks(this.player.pos);

        // Update player physics
        this.player.update(dt, this.input);
        this.input.lookX = 0;
        this.input.lookY = 0;
        this.input.jump = false;

        // Center directional sun shadow around player
        this.sun.position.set(this.player.pos.x + 40, 65, this.player.pos.z + 30);
        this.sun.target.position.copy(this.player.pos);

        // Update 20 Zombie types & 20 Boss types
        this.zombieMgr.update(
          dt,
          this.player.pos,
          (dmg, zName) => {
            const finalDmg = Math.max(2, dmg - Math.floor(this.player.armor * 0.2));
            this.player.hp -= finalDmg;
            this.showToast(`💥 ${zName} цохилоо (-${finalDmg} HP)`);
            if (this.player.hp <= 0) {
              // Respawn at Safe Zone
              this.player.hp = 100;
              this.player.hunger = 100;
              this.player.thirst = 100;
              this.player.pos.set(0, 0, 5);
              this.showToast('🏥 Safe Zone дээр дахин төрлөө!');
            }
          },
          (boss) => this.showToast(`⚠️ АНХААР! ${boss.def.name} гарч ирлээ!`)
        );

        this.world.update(dt, this.zombieMgr);
        this.renderer.render(this.scene, this.camera);
        this.updateHUD(dt);
      }

      updateHUD(dt) {
        document.getElementById('hp-fill').style.width = `${(this.player.hp / this.player.maxHp) * 100}%`;
        document.getElementById('hp-text').textContent = Math.ceil(this.player.hp);
        document.getElementById('hunger-fill').style.width = `${this.player.hunger}%`;
        document.getElementById('hunger-text').textContent = Math.ceil(this.player.hunger);
        document.getElementById('thirst-fill').style.width = `${this.player.thirst}%`;
        document.getElementById('thirst-text').textContent = Math.ceil(this.player.thirst);

        // Ammo HUD for equipped gun
        const eq = this.player.getEquippedItem();
        const ammoHud = document.getElementById('ammo-hud');
        if (eq && eq.type === 'gun') {
          const mag = this.player.magAmmo[eq.id] ?? eq.magSize;
          const res = this.player.inventory[eq.ammoType] || 0;
          ammoHud.style.display = 'block';
          ammoHud.textContent = `СУМ: ${mag} / ${res}`;
        } else {
          ammoHud.style.display = 'none';
        }

        // Boss Health Bar if a Boss Zombie is active
        const activeBoss = this.zombieMgr.zombies.find((z) => z.isBoss);
        const bossWrap = document.getElementById('boss-bar-wrap');
        if (activeBoss) {
          bossWrap.style.display = 'block';
          document.getElementById('boss-name').textContent = `${activeBoss.def.name} [${Math.ceil(activeBoss.hp)}/${activeBoss.maxHp}]`;
          document.getElementById('boss-hp-fill').style.width = `${Math.max(0, (activeBoss.hp / activeBoss.maxHp) * 100)}%`;
        } else {
          bossWrap.style.display = 'none';
        }

        // Check Loot Crate proximity prompt
        const nearCrate = this.world.lootCrates.find((c) => !c.opened && c.pos.distanceTo(this.player.pos) < 3.6);
        const promptEl = document.getElementById('target-prompt');
        if (nearCrate) {
          promptEl.style.display = 'block';
          promptEl.textContent = '📦 Санамсаргүй Loot Хайрцаг [LOOT дарна уу]';
        } else {
          promptEl.style.display = 'none';
        }

        this.fpsFrames++;
        this.fpsTime += dt;
        if (this.fpsTime >= 0.4) {
          const fps = Math.round(this.fpsFrames / this.fpsTime);
          this.fpsFrames = 0;
          this.fpsTime = 0;
          const px = Math.round(this.player.pos.x);
          const pz = Math.round(this.player.pos.z);
          document.getElementById('zone-label').textContent = this.world.getBiomeAt(px, pz);
          document.getElementById('coord-label').textContent = `X:${px} Z:${pz}`;
          document.getElementById('fps-label').textContent = `${fps} FPS`;
        }
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', () => new GameController());
    } else {
      new GameController();
    }
  </script>
</body>
</html>
