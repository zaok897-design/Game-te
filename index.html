        const gPBR = PBRTextures.createPBRSet([72, 82, 60], 36, 16, 'noise');
        const cPBR = PBRTextures.createPBRSet([52, 56, 62], 30, 16, 'concrete');
        const wallPBR = PBRTextures.createPBRSet([102, 106, 104], 34, 3, 'concrete');
        const barkPBR = PBRTextures.createPBRSet([82, 56, 36], 38, 2, 'wood');
        const leafPBR = PBRTextures.createPBRSet([40, 76, 44], 34, 2, 'noise');
        const rockPBR = PBRTextures.createPBRSet([108, 112, 118], 42, 2, 'concrete');
        const barrelPBR = PBRTextures.createPBRSet([168, 46, 36], 35, 1, 'rust');

        this.matGround = new THREE.MeshStandardMaterial({ map: gPBR.map, bumpMap: gPBR.bumpMap, bumpScale: 0.04, roughness: 0.94 });
        this.matCityGround = new THREE.MeshStandardMaterial({ map: cPBR.map, bumpMap: cPBR.bumpMap, bumpScale: 0.03, roughness: 0.9 });
        this.matConcrete = new THREE.MeshStandardMaterial({ map: wallPBR.map, bumpMap: wallPBR.bumpMap, bumpScale: 0.035, roughness: 0.86 });
        this.matBark = new THREE.MeshStandardMaterial({ map: barkPBR.map, bumpMap: barkPBR.bumpMap, bumpScale: 0.03, roughness: 0.92 });
        this.matLeaves = new THREE.MeshStandardMaterial({ map: leafPBR.map, bumpMap: leafPBR.bumpMap, bumpScale: 0.02, roughness: 0.84 });
        this.matRock = new THREE.MeshStandardMaterial({ map: rockPBR.map, bumpMap: rockPBR.bumpMap, bumpScale: 0.04, roughness: 0.85 });
        this.matOre = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.5, roughness: 0.25, metalness: 0.85 });
        this.matBarrel = new THREE.MeshStandardMaterial({ map: barrelPBR.map, bumpMap: barrelPBR.bumpMap, bumpScale: 0.02, roughness: 0.48, metalness: 0.65 });
        this.matMilCrate = new THREE.MeshStandardMaterial({ color: 0x3f6212, roughness: 0.55, metalness: 0.45 });
      }

      rng(seed) {
        let s = seed | 0;
        return () => {
          s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      getTerrainHeight(x, z) {
        const dist0 = Math.hypot(x, z);
        if (dist0 < 28) return 0;
        const blend = Math.min(1, (dist0 - 28) / 30);
        const h = Math.sin(x * 0.018) * Math.cos(z * 0.018) * 5.0 + Math.sin(x * 0.045 + z * 0.035) * 1.6;
        return Math.max(-1.5, h * blend);
      }

      getBiomeAt(x, z) {
        if (Math.hypot(x, z) < 30) return 'SAFE ZONE (АЮУЛГҮЙ БҮС)';
        const val = Math.sin(x * 0.0045) + Math.cos(z * 0.0045);
        if (val > 0.85) return 'ABANDONED CITY (ХАЯГДСАН ХОТ)';
        if (val < -0.85) return 'MOUNTAIN MINES (УУЛЫН АГУЙ)';
        if (Math.sin(x * 0.009 - z * 0.007) > 0.35) return 'DENSE FOREST (ӨТГӨН ОЙ)';
        return 'RUST WASTELAND (ЭЗГҮЙ ТОСГОН)';
      }

      buildSafeZoneHub() {
        const wall = (x, z, w, d) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, 3, d), this.matConcrete);
          m.position.set(x, 1.5, z);
          m.castShadow = true;
          m.receiveShadow = true;
          this.scene.add(m);
          this.colliders.push({ minX: x - w / 2, maxX: x + w / 2, minY: 0, maxY: 3, minZ: z - d / 2, maxZ: z + d / 2 });
        };
        wall(0, 16, 30, 0.8);
        wall(-15, 0, 0.8, 32);
        wall(15, 0, 0.8, 32);
        wall(-9, -16, 12, 0.8);
        wall(9, -16, 12, 0.8);

        const beacon = new THREE.PointLight(0x84cc16, 4.5, 28);
        beacon.position.set(0, 4.5, -16);
        this.scene.add(beacon);
      }

      updateChunks(playerPos) {
        const pcx = Math.floor(playerPos.x / this.chunkSize);
        const pcz = Math.floor(playerPos.z / this.chunkSize);
        const needed = new Set();

        for (let dx = -this.viewRadius; dx <= this.viewRadius; dx++) {
          for (let dz = -this.viewRadius; dz <= this.viewRadius; dz++) {
            const cx = pcx + dx;
            const cz = pcz + dz;
            const midX = (cx + 0.5) * this.chunkSize;
            const midZ = (cz + 0.5) * this.chunkSize;
            if (Math.abs(midX) > this.worldHalf || Math.abs(midZ) > this.worldHalf) continue;
            const key = `${cx},${cz}`;
            needed.add(key);
            if (!this.chunks.has(key)) this.loadChunk(cx, cz, key);
          }
        }

        for (const [key, chunk] of this.chunks.entries()) {
          if (!needed.has(key)) {
            this.scene.remove(chunk.group);
            this.colliders = this.colliders.filter((c) => !chunk.chunkColliders.includes(c));
            this.gatherables = this.gatherables.filter((g) => !chunk.chunkGatherables.includes(g));
            this.lootCrates = this.lootCrates.filter((l) => !chunk.chunkCrates.includes(l));
            this.chunks.delete(key);
          }
        }
      }

      loadChunk(cx, cz, key) {
        const group = new THREE.Group();
        const chunkColliders = [];
        const chunkGatherables = [];
        const chunkCrates = [];

        const startX = cx * this.chunkSize;
        const startZ = cz * this.chunkSize;
        const midX = startX + this.chunkSize / 2;
        const midZ = startZ + this.chunkSize / 2;
        const biome = this.getBiomeAt(midX, midZ);

        const segs = 12;
        const geo = new THREE.PlaneGeometry(this.chunkSize, this.chunkSize, segs, segs);
        geo.rotateX(-Math.PI / 2);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          pos.setY(i, this.getTerrainHeight(pos.getX(i) + midX, pos.getZ(i) + midZ));
        }
        geo.computeVertexNormals();
        const ground = new THREE.Mesh(geo, biome.includes('CITY') ? this.matCityGround : this.matGround);
        ground.position.set(midX, 0, midZ);
        ground.receiveShadow = true;
        group.add(ground);

        const rand = this.rng(cx * 73856093 ^ cz * 19349663);

        if (Math.hypot(midX, midZ) >= 24) {
          // Buildings
          const bCount = biome.includes('CITY') ? 3 : biome.includes('WASTELAND') ? 1 : 0;
          for (let b = 0; b < bCount; b++) {
            const bx = startX + 14 + rand() * (this.chunkSize - 28);
            const bz = startZ + 14 + rand() * (this.chunkSize - 28);
            const bw = 9 + rand() * 8;
            const bd = 9 + rand() * 8;
            const bh = biome.includes('CITY') ? 10 + rand() * 14 : 4.8 + rand() * 3;
            const by = this.getTerrainHeight(bx, bz);

            const bMesh = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), this.matConcrete);
            bMesh.position.set(bx, by + bh / 2, bz);
            bMesh.castShadow = true;
            bMesh.receiveShadow = true;
            group.add(bMesh);

            const col = { minX: bx - bw / 2, maxX: bx + bw / 2, minY: by, maxY: by + bh, minZ: bz - bd / 2, maxZ: bz + bd / 2 };
            chunkColliders.push(col);
            this.colliders.push(col);

            this.spawnRustLoot(bx + bw / 2 + 1.5, bz, true, group, chunkCrates);
          }

          // Multi-layered Pine Trees
          const tCount = biome.includes('FOREST') ? 12 : biome.includes('CITY') ? 2 : 5;
          for (let t = 0; t < tCount; t++) {
            const tx = startX + 4 + rand() * (this.chunkSize - 8);
            const tz = startZ + 4 + rand() * (this.chunkSize - 8);
            const ty = this.getTerrainHeight(tx, tz);
            const sc = 0.85 + rand() * 0.5;

            const tree = new THREE.Group();
            tree.position.set(tx, ty, tz);
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22 * sc, 0.36 * sc, 3.4 * sc, 7), this.matBark);
            trunk.position.y = 1.7 * sc;
            trunk.castShadow = true;
            tree.add(trunk);

            for (let layer = 0; layer < 3; layer++) {
              const cone = new THREE.Mesh(new THREE.ConeGeometry((1.85 - layer * 0.42) * sc, 2.5 * sc, 7), this.matLeaves);
              cone.position.y = (3.4 + layer * 1.2) * sc;
              cone.castShadow = true;
              tree.add(cone);
            }
            group.add(tree);

            const col = { minX: tx - 0.45, maxX: tx + 0.45, minY: ty, maxY: ty + 5, minZ: tz - 0.45, maxZ: tz + 0.45 };
            chunkColliders.push(col);
            this.colliders.push(col);

            const gItem = { type: 'wood', label: 'Мод (Wood)', mesh: tree, hitTarget: trunk, collider: col, pos: new THREE.Vector3(tx, ty + 1.4, tz), hp: 60, maxHp: 60 };
            chunkGatherables.push(gItem);
            this.gatherables.push(gItem);
          }

          // Rocks & Ores
          const rCount = biome.includes('MOUNTAIN') ? 8 : 3;
          for (let r = 0; r < rCount; r++) {
            const rx = startX + 5 + rand() * (this.chunkSize - 10);
            const rz = startZ + 5 + rand() * (this.chunkSize - 10);
            const ry = this.getTerrainHeight(rx, rz);
            const roll = rand();
            let resType = 'stone', resLabel = 'Чулуу (Stone)';
            if (roll > 0.72) { resType = 'titanium_ore'; resLabel = 'Титан Хүдэр'; }
            else if (roll > 0.48) { resType = 'iron_ore'; resLabel = 'Төмрийн Хүдэр'; }
            else if (roll > 0.34) { resType = 'sulfur'; resLabel = 'Хүхэр (Sulfur)'; }
            else if (roll > 0.22) { resType = 'copper_ore'; resLabel = 'Зэсийн Хүдэр'; }

            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.05, 0), resType === 'stone' ? this.matRock : this.matOre);
            rock.position.set(rx, ry + 0.65, rz);
            rock.castShadow = true;
            group.add(rock);

            const col = { minX: rx - 0.9, maxX: rx + 0.9, minY: ry, maxY: ry + 1.4, minZ: rz - 0.9, maxZ: rz + 0.9 };
            chunkColliders.push(col);
            this.colliders.push(col);

            const gItem = { type: resType, label: resLabel, mesh: rock, hitTarget: rock, collider: col, pos: new THREE.Vector3(rx, ry + 0.7, rz), hp: 75, maxHp: 75 };
            chunkGatherables.push(gItem);
            this.gatherables.push(gItem);
          }

          // Rust Red Barrels & Military Crates
          this.spawnRustLoot(midX + (rand() - 0.5) * 35, midZ + (rand() - 0.5) * 35, false, group, chunkCrates);
          if (rand() > 0.4) {
            this.spawnRustLoot(midX + (rand() - 0.5) * 35, midZ + (rand() - 0.5) * 35, true, group, chunkCrates);
          }
        } else {
          // Starter Rust Barrel & Military Crate inside Safe Zone
          this.spawnRustLoot(4.5, -5, true, group, chunkCrates);
          this.spawnRustLoot(-4.5, -5, false, group, chunkCrates);
        }

        this.scene.add(group);
        this.chunks.set(key, { group, chunkColliders, chunkGatherables, chunkCrates });
      }

      spawnRustLoot(x, z, isCrate, parentGroup, chunkCrates) {
        const y = this.getTerrainHeight(x, z);
        const mesh = isCrate
          ? new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.75, 0.8), this.matMilCrate)
          : new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 1.15, 12), this.matBarrel);
        mesh.position.set(x, y + (isCrate ? 0.38 : 0.58), z);
        mesh.castShadow = true;
        parentGroup.add(mesh);

        const data = { mesh, isCrate, pos: new THREE.Vector3(x, y + 0.5, z), opened: false };
        chunkCrates.push(data);
        this.lootCrates.push(data);
      }

      placePlayerBuilding(pos, yaw, itemDef) {
        const grid = 3.0;
        const bx = Math.round(pos.x / grid) * grid;
        const bz = Math.round(pos.z / grid) * grid;
        const by = this.getTerrainHeight(bx, bz);

        const woodPBR = PBRTextures.createPBRSet([122, 82, 46], 35, 2, 'wood');
        const mat = new THREE.MeshStandardMaterial({
          color: itemDef.color,
          map: woodPBR.map,
          bumpMap: woodPBR.bumpMap,
          bumpScale: 0.025,
          roughness: 0.78,
          metalness: 0.2
        });

        const mesh = new THREE.Mesh(new THREE.BoxGeometry(itemDef.w, itemDef.h, itemDef.d), mat);
        mesh.position.set(bx, by + itemDef.h / 2, bz);
        mesh.rotation.y = yaw;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        this.scene.add(mesh);

        const col = {
          minX: bx - itemDef.w / 2,
          maxX: bx + itemDef.w / 2,
          minY: by,
          maxY: by + itemDef.h,
          minZ: bz - itemDef.d / 2,
          maxZ: bz + itemDef.d / 2
        };
        this.colliders.push(col);

        this.playerStructures.push({
          mesh,
          pos: new THREE.Vector3(bx, by + itemDef.h / 2, bz),
          hp: itemDef.hp,
          isTurret: itemDef.isTurret,
          cooldown: 0
        });
      }

      spawnBurst(pos, hex) {
        const mat = new THREE.MeshBasicMaterial({ color: hex });
        const geo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
        for (let i = 0; i < 7; i++) {
          const p = new THREE.Mesh(geo, mat);
          p.position.copy(pos);
          this.scene.add(p);
          this.particles.push({
            mesh: p,
            vel: new THREE.Vector3((Math.random() - 0.5) * 4.5, 2 + Math.random() * 3.5, (Math.random() - 0.5) * 4.5),
            life: 0.45
          });
        }
      }

      update(dt, zombieMgr) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            this.scene.remove(p.mesh);
            this.particles.splice(i, 1);
          } else {
            p.vel.y -= 12 * dt;
            p.mesh.position.addScaledVector(p.vel, dt);
          }
        }

        for (const st of this.playerStructures) {
          if (!st.isTurret) continue;
          st.cooldown -= dt;
          if (st.cooldown <= 0 && zombieMgr.zombies.length > 0) {
            const target = zombieMgr.findNearest(st.pos, 24);
            if (target) {
              st.cooldown = 0.55;
              zombieMgr.damageZombie(target, 50);
              this.spawnBurst(target.group.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 0xfacc15);
            }
          }
        }
      }
    }

    // =========================================================
    // 6. ARTICULATED HUMANOID ZOMBIE & BOSS RIGS + AI
    // =========================================================
    class ZombieManager {
      constructor(scene, world) {
        this.scene = scene;
        this.world = world;
        this.zombies = [];
        this.dyingZombies = [];
        this.spawnTimer = 0;
        this.bossTimer = 16;
      }

      createArticulatedZombie(def, isBoss) {
        const group = new THREE.Group();
        const s = def.scale;

        const clothMat = new THREE.MeshStandardMaterial({ color: def.bodyCol, roughness: 0.88 });
        const skinMat = new THREE.MeshStandardMaterial({ color: def.skinCol, roughness: 0.82 });
        const bootMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.9 });
        const eyeMat = new THREE.MeshBasicMaterial({ color: def.eyeCol });

        // Legs (Articulated for realistic running stride)
        const legGeo = new THREE.BoxGeometry(0.18 * s, 0.72 * s, 0.2 * s);
        const leftLeg = new THREE.Group();
        leftLeg.position.set(-0.16 * s, 0.74 * s, 0);
        const lShin = new THREE.Mesh(legGeo, bootMat);
        lShin.position.y = -0.36 * s;
        lShin.castShadow = true;
        leftLeg.add(lShin);

        const rightLeg = new THREE.Group();
        rightLeg.position.set(0.16 * s, 0.74 * s, 0);
        const rShin = new THREE.Mesh(legGeo, bootMat);
        rShin.position.y = -0.36 * s;
        rShin.castShadow = true;
        rightLeg.add(rShin);
        group.add(leftLeg, rightLeg);

        // Torso + Tattered Armor / Ribs
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.56 * s, 0.78 * s, 0.3 * s), clothMat);
        torso.position.y = 1.12 * s;
        torso.rotation.x = 0.14; // Hunched zombie posture
        torso.castShadow = true;
        group.add(torso);

        // Sculpted Head + Jaw + Glowing Sunken Eyes
        const headGroup = new THREE.Group();
        headGroup.position.set(0, 1.68 * s, 0.08 * s);
        const cranium = new THREE.Mesh(new THREE.BoxGeometry(0.36 * s, 0.36 * s, 0.38 * s), skinMat);
        cranium.castShadow = true;
        const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.28 * s, 0.12 * s, 0.3 * s), skinMat);
        jaw.position.set(0, -0.2 * s, 0.03 * s);

        const eyeGeo = new THREE.SphereGeometry(0.038 * s, 8, 8);
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(-0.09 * s, 0.03 * s, 0.19 * s);
        const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeR.position.set(0.09 * s, 0.03 * s, 0.19 * s);
        headGroup.add(cranium, jaw, eyeL, eyeR);
        group.add(headGroup);

        // Outstretched Clawing Arms
        const armGeo = new THREE.BoxGeometry(0.15 * s, 0.15 * s, 0.68 * s);
        const leftArm = new THREE.Group();
        leftArm.position.set(-0.38 * s, 1.38 * s, 0.05 * s);
        const lArmMesh = new THREE.Mesh(armGeo, skinMat);
        lArmMesh.position.z = 0.3 * s;
        lArmMesh.castShadow = true;
        leftArm.add(lArmMesh);

        const rightArm = new THREE.Group();
        rightArm.position.set(0.38 * s, 1.38 * s, 0.05 * s);
        const rArmMesh = new THREE.Mesh(armGeo, skinMat);
        rArmMesh.position.z = 0.3 * s;
        rArmMesh.castShadow = true;
        rightArm.add(rArmMesh);
        group.add(leftArm, rightArm);

        // Boss Spikes, Crown & Eerie Light Aura
        if (isBoss) {
          const spikeMat = new THREE.MeshStandardMaterial({ color: def.eyeCol, emissive: def.eyeCol, emissiveIntensity: 0.6 });
          const spikeL = new THREE.Mesh(new THREE.ConeGeometry(0.14 * s, 0.55 * s, 5), spikeMat);
          spikeL.position.set(-0.36 * s, 1.65 * s, 0);
          spikeL.rotation.z = 0.45;
          const spikeR = new THREE.Mesh(new THREE.ConeGeometry(0.14 * s, 0.55 * s, 5), spikeMat);
          spikeR.position.set(0.36 * s, 1.65 * s, 0);
          spikeR.rotation.z = -0.45;
          group.add(spikeL, spikeR);

          const aura = new THREE.PointLight(def.eyeCol, 4.0, 16);
          aura.position.y = 1.8 * s;
          group.add(aura);
        }

        // Invisible Hitbox for Accurate Shooting & Melee
        const hitbox = new THREE.Mesh(
          new THREE.BoxGeometry(0.95 * s, 2.05 * s, 0.95 * s),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        hitbox.position.y = 1.02 * s;
        group.add(hitbox);

        return { group, hitbox, leftArm, rightArm, leftLeg, rightLeg, headGroup };
      }

      spawnZombie(playerPos, isBoss = false) {
        const pool = isBoss ? GameCatalog.bossTypes : GameCatalog.zombieTypes;
        const def = pool[Math.floor(Math.random() * pool.length)];

        const angle = Math.random() * Math.PI * 2;
        const dist = isBoss ? 32 : 20 + Math.random() * 34;
        const sx = Math.max(-1980, Math.min(1980, playerPos.x + Math.cos(angle) * dist));
        const sz = Math.max(-1980, Math.min(1980, playerPos.z + Math.sin(angle) * dist));
        if (Math.hypot(sx, sz) < 21) return null;

        const sy = this.world.getTerrainHeight(sx, sz);
        const rig = this.createArticulatedZombie(def, isBoss);
        rig.group.position.set(sx, sy, sz);
        this.scene.add(rig.group);

        const zObj = {
          def,
          isBoss,
          hp: def.hp,
          maxHp: def.hp,
          ...rig,
          attackCooldown: 0,
          animTimer: Math.random() * 10
        };
        this.zombies.push(zObj);
        return zObj;
      }

      findNearest(pos, maxDist) {
        let best = null, bestD = maxDist;
        for (const z of this.zombies) {
          const d = z.group.position.distanceTo(pos);
          if (d < bestD) { bestD = d; best = z; }
        }
        return best;
      }

      damageZombie(z, amount) {
        z.hp -= amount;
        this.world.spawnBurst(z.group.position.clone().add(new THREE.Vector3(0, 1.2 * z.def.scale, 0)), 0xb91c1c);
        // Hit stagger
        z.headGroup.rotation.x = -0.35;
        setTimeout(() => { if (z.headGroup) z.headGroup.rotation.x = 0; }, 120);

        if (z.hp <= 0) {
          this.zombies = this.zombies.filter((item) => item !== z);
          this.dyingZombies.push({ group: z.group, timer: 0.9 });
          return true;
        }
        return false;
      }

      update(dt, playerPos, onPlayerHit, onBossAlert) {
        // Animate dying zombies falling backward
        for (let i = this.dyingZombies.length - 1; i >= 0; i--) {
          const dz = this.dyingZombies[i];
          dz.timer -= dt;
          dz.group.rotation.x = Math.max(-Math.PI / 2, dz.group.rotation.x - dt * 4.5);
          if (dz.timer <= 0) {
            this.scene.remove(dz.group);
            this.dyingZombies.splice(i, 1);
          }
        }

        const inSafeZone = Math.hypot(playerPos.x, playerPos.z) < 17;

        this.spawnTimer -= dt;
        if (this.spawnTimer <= 0 && this.zombies.length < 18 && !inSafeZone) {
          this.spawnTimer = 2.0;
          this.spawnZombie(playerPos, false);
        }

        const hasBoss = this.zombies.some((z) => z.isBoss);
        if (!hasBoss && !inSafeZone) {
          this.bossTimer -= dt;
          if (this.bossTimer <= 0) {
            this.bossTimer = 42;
            const boss = this.spawnZombie(playerPos, true);
            if (boss && onBossAlert) onBossAlert(boss);
          }
        }

        for (let i = this.zombies.length - 1; i >= 0; i--) {
          const z = this.zombies[i];
          const zPos = z.group.position;
          const dist = zPos.distanceTo(playerPos);

          if (dist > 115) {
            this.scene.remove(z.group);
            this.zombies.splice(i, 1);
            continue;
          }

          if (Math.hypot(zPos.x, zPos.z) < 18) {
            zPos.x += (zPos.x >= 0 ? 1 : -1) * 4 * dt;
            continue;
          }

          const dx = playerPos.x - zPos.x;
          const dz = playerPos.z - zPos.z;
          z.group.rotation.y = Math.atan2(dx, dz);

          const reach = 1.65 * z.def.scale;
          if (dist > reach) {
            zPos.x += (dx / dist) * z.def.speed * dt;
            zPos.z += (dz / dist) * z.def.speed * dt;
            zPos.y = this.world.getTerrainHeight(zPos.x, zPos.z);

            z.animTimer += dt * z.def.speed * 3.2;
            const stride = Math.sin(z.animTimer) * 0.55;
            z.leftLeg.rotation.x = stride;
            z.rightLeg.rotation.x = -stride;
            z.leftArm.rotation.x = Math.sin(z.animTimer) * 0.22;
            z.rightArm.rotation.x = -Math.sin(z.animTimer) * 0.22;
          } else {
            z.attackCooldown -= dt;
            if (z.attackCooldown <= 0) {
              z.attackCooldown = 1.1;
              // Lunge arms forward on attack
              z.leftArm.rotation.x = -0.75;
              z.rightArm.rotation.x = -0.75;
              setTimeout(() => {
                if (z.leftArm) { z.leftArm.rotation.x = 0; z.rightArm.rotation.x = 0; }
              }, 220);
              onPlayerHit(z.def.dmg, z.def.name);
            }
          }
        }
      }
    }

    // =========================================================
    // 7. PLAYER SYSTEM (FIXED ITEM USAGE, ARMOR, ADS & COMBAT)
    // =========================================================
    class PlayerSystem {
      constructor(camera, scene, world, zombieMgr, sfx) {
        this.camera = camera;
        this.scene = scene;
        this.world = world;
        this.zombieMgr = zombieMgr;
        this.sfx = sfx;

        this.pos = new THREE.Vector3(0, 0, 5);
        this.vel = new THREE.Vector3(0, 0, 0);
        this.yaw = 0;
        this.pitch = 0;
        this.radius = 0.42;
        this.isGrounded = false;
        this.isADS = false;
        this.buildYawOffset = 0;

        this.hp = 100;
        this.maxHp = 100;
        this.hunger = 100;
        this.thirst = 100;
        this.armor = 0;

        // Starter Rust Survival Kit (Ready to test immediately)
        this.inventory = {
          gun_ak_0: 1,
          ammo_762: 90,
          tool_stone_axe: 1,
          tool_stone_pick: 1,
          bandage: 5,
          cooked_meat: 4,
          clean_water: 4,
          build_wood_plank_wall: 8,
          build_steel_ingot_turret: 1,
          wood: 15,
          stone: 15
        };

        this.hotbar = [
          'gun_ak_0',
          'tool_stone_axe',
          'tool_stone_pick',
          'bandage',
          'cooked_meat',
          'clean_water',
          'build_wood_plank_wall',
          'build_steel_ingot_turret'
        ];
        this.selectedSlot = 0;
        this.magAmmo = { gun_ak_0: 30 };
        this.fireCooldown = 0;
        this.swingProgress = 0;
        this.isSwinging = false;

        this.raycaster = new THREE.Raycaster();
        this.tracers = [];

        this.viewmodel = new FirstPersonViewmodel(this.camera);
        this.flashlight = new THREE.SpotLight(0xfff4d8, 3.2, 52, Math.PI / 4.2, 0.4, 1.0);
        this.flashlight.position.set(-0.2, -0.1, -0.2);
        this.flashlight.target.position.set(0, -0.1, -14);
        this.camera.add(this.flashlight, this.flashlight.target);
        this.scene.add(this.camera);

        this.buildGhost = new THREE.Mesh(
          new THREE.BoxGeometry(3, 3, 0.4),
          new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.42 })
        );
        this.buildGhost.visible = false;
        this.scene.add(this.buildGhost);

        this.refreshEquipped();
      }

      getEquippedItem() {
        const id = this.hotbar[this.selectedSlot];
        if (!id || !this.inventory[id] || this.inventory[id] <= 0) return null;
        return GameCatalog.items[id] || null;
      }

      refreshEquipped() {
        const item = this.getEquippedItem();
        if (!item || item.type !== 'gun') this.isADS = false;
        this.viewmodel.setEquippedModel(item);
      }

      addItem(id, qty = 1) {
        this.inventory[id] = (this.inventory[id] || 0) + qty;
        const item = GameCatalog.items[id];
        if (item && ['gun', 'melee', 'tool', 'building', 'consumable'].includes(item.type)) {
          if (!this.hotbar.includes(id)) {
            const emptyIdx = this.hotbar.indexOf(null);
            if (emptyIdx !== -1) this.hotbar[emptyIdx] = id;
          }
        }
        this.refreshEquipped();
      }

      removeItem(id, qty = 1) {
        if (!this.inventory[id] || this.inventory[id] < qty) return false;
        this.inventory[id] -= qty;
        if (this.inventory[id] <= 0) {
          delete this.inventory[id];
          const hIdx = this.hotbar.indexOf(id);
          if (hIdx !== -1) this.hotbar[hIdx] = null;
        }
        this.refreshEquipped();
        return true;
      }

      // Direct Use / Equip from Inventory Bag OR Hotbar
      useOrEquipItemById(id, onToast) {
        const item = GameCatalog.items[id];
        if (!item || !this.inventory[id]) return false;

        if (item.type === 'consumable') {
          this.hp = Math.min(this.maxHp, Math.max(1, this.hp + (item.hp || 0)));
          this.hunger = Math.min(100, Math.max(0, this.hunger + (item.hunger || 0)));
          this.thirst = Math.min(100, Math.max(0, this.thirst + (item.thirst || 0)));
          this.removeItem(id, 1);
          this.sfx.playUseItem();
          onToast(`✨ ${item.name} хэрэглэлээ!`);
          return true;
        }

        if (item.type === 'armor') {
          this.armor = Math.min(100, this.armor + (item.defense || 10));
          this.maxHp = 100 + this.armor;
          this.hp = Math.min(this.maxHp, this.hp + (item.defense || 10));
          this.removeItem(id, 1);
          this.sfx.playUseItem();
          onToast(`🦺 ${item.name} өмслөө! (Armor: ${this.armor})`);
          return true;
        }

        // Otherwise equip to active hotbar slot
        this.hotbar[this.selectedSlot] = id;
        this.refreshEquipped();
        onToast(`✋ Гарт барилаа: ${item.name}`);
        return true;
      }

      reloadGun(onToast) {
        const item = this.getEquippedItem();
        if (!item || item.type !== 'gun') return;
        const current = this.magAmmo[item.id] ?? item.magSize;
        const needed = item.magSize - current;
        if (needed <= 0) return;

        const avail = this.inventory[item.ammoType] || 0;
        if (avail <= 0) {
          onToast('❌ Сум дууссан! (520 Craft цэснээс сум хийнэ үү)');
          return;
        }
        const load = Math.min(needed, avail);
        this.removeItem(item.ammoType, load);
        this.magAmmo[item.id] = current + load;
        this.sfx.playReload();
        onToast(`🔄 Цэнэглэлээ (+${load} сум)`);
      }

      // Called on single tap OR while holding down FIRE/ACTION button
      useActiveItem(isContinuousHold, onToast, onZombieKilled) {
        const item = this.getEquippedItem();

        // Bare hands punch
        if (!item) {
          if (this.isSwinging) return;
          this.isSwinging = true;
          this.swingProgress = 0.01;
          this.performMeleeOrGather(20, onToast, onZombieKilled);
          return;
        }

        // 1. Gun Fire
        if (item.type === 'gun') {
          if (isContinuousHold && !item.auto) return; // Semi-auto requires tap
          if (this.fireCooldown > 0) return;

          if (this.magAmmo[item.id] === undefined) this.magAmmo[item.id] = item.magSize;
          if (this.magAmmo[item.id] <= 0) {
            if (!isContinuousHold) this.reloadGun(onToast);
            return;
          }

          this.magAmmo[item.id]--;
          this.fireCooldown = item.fireRate;
          this.viewmodel.triggerRecoil(true);
          this.pitch += this.isADS ? 0.008 : 0.015;
          this.sfx.playGunshot(item.gunClass === 'sniper' ? 0.7 : 1.05);
          this.fireBullet(item.damage, onZombieKilled);
          return;
        }

        // 2. Melee / Tool (Supports holding button to keep chopping/mining!)
        if (item.type === 'melee' || item.type === 'tool') {
          if (this.isSwinging) return;
          this.isSwinging = true;
          this.swingProgress = 0.01;
          this.performMeleeOrGather(item.damage || item.power || 28, onToast, onZombieKilled);
          return;
        }

        // Single-tap actions below (never trigger repeatedly while holding)
        if (isContinuousHold) return;

        // 3. Consumable (Bandage, Medkit, Water, Food)
        if (item.type === 'consumable') {
          this.useOrEquipItemById(item.id, onToast);
          return;
        }

        // 4. Base Building Placement
        if (item.type === 'building') {
          const placePos = this.getBuildPreviewPos();
          this.world.placePlayerBuilding(placePos, this.getSnappedBuildYaw(), item);
          this.removeItem(item.id, 1);
          this.sfx.playImpact(180);
          onToast(`🧱 ${item.name} баригдлаа!`);
        }
      }

      fireBullet(damage, onZombieKilled) {
        this.raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);
        this.raycaster.far = 150;

        const start = this.camera.position.clone().add(new THREE.Vector3(0, -0.08, 0));
        const dir = new THREE.Vector3();
        this.camera.getWorldDirection(dir);
        const end = start.clone().addScaledVector(dir, 70);

        const hitboxes = this.zombieMgr.zombies.map((z) => z.hitbox);
        const hits = this.raycaster.intersectObjects(hitboxes, false);
        if (hits.length > 0) {
          end.copy(hits[0].point);
          const zObj = this.zombieMgr.zombies.find((z) => z.hitbox === hits[0].object);
          if (zObj) {
            const ch = document.getElementById('crosshair');
            ch.classList.add('hit');
            setTimeout(() => ch.classList.remove('hit'), 110);

            const killed = this.zombieMgr.damageZombie(zObj, damage);
            if (killed) onZombieKilled(zObj);
          }
        }

        const lineGeo = new THREE.BufferGeometry().setFromPoints([start, end]);
        const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xfef08a }));
        this.scene.add(line);
        this.tracers.push({ mesh: line, life: 0.07 });
      }

      performMeleeOrGather(power, onToast, onZombieKilled) {
        this.raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);
        this.raycaster.far = 4.2;

        // 1. Hit Zombie
        const zHits = this.raycaster.intersectObjects(this.zombieMgr.zombies.map((z) => z.hitbox), false);
        if (zHits.length > 0) {
          const zObj = this.zombieMgr.zombies.find((z) => z.hitbox === zHits[0].object);
          if (zObj) {
            this.sfx.playImpact(110);
            const killed = this.zombieMgr.damageZombie(zObj, power);
            if (killed) onZombieKilled(zObj);
            return;
          }
        }

        // 2. Smash Rust Barrel / Crate directly with Hatchet/Crowbar
        const unopened = this.world.lootCrates.filter((c) => !c.opened);
        const cHits = this.raycaster.intersectObjects(unopened.map((c) => c.mesh), false);
        if (cHits.length > 0) {
          const crate = unopened.find((c) => c.mesh === cHits[0].object);
          if (crate) {
            this.openCrateOrBarrel(crate, onToast);
            return;
          }
        }

        // 3. Gather Wood / Stone / Ore
        const activeG = this.world.gatherables.filter((g) => g.hp > 0);
        const gHits = this.raycaster.intersectObjects(activeG.map((g) => g.hitTarget), false);
        if (gHits.length > 0) {
          const res = activeG.find((g) => g.hitTarget === gHits[0].object);
          if (res) {
            res.hp -= power;
            this.sfx.playImpact(res.type === 'wood' ? 140 : 420);
            this.world.spawnBurst(res.pos, res.type === 'wood' ? 0xb45309 : 0x38bdf8);
            if (res.hp <= 0) {
              res.mesh.visible = false;
              res.collider.disabled = true;
              const yieldQty = 4 + Math.floor(Math.random() * 4);
              this.addItem(res.type, yieldQty);
              onToast(`+${yieldQty} ${res.label}`);
            } else {
              onToast(`⛏️ ${res.label} [${Math.max(0, res.hp)}/${res.maxHp}]`);
            }
          }
        }
      }

      openCrateOrBarrel(crate, onToast) {
        crate.opened = true;
        this.sfx.playImpact(260);
        this.world.spawnBurst(crate.pos, 0xf59e0b);
        if (!crate.isCrate) {
          // Rust barrels smash apart when opened
          crate.mesh.visible = false;
        } else {
          crate.mesh.material = new THREE.MeshStandardMaterial({ color: 0x334155 });
        }

        const pool = [
          'scrap_metal', 'cloth', 'gunpowder', 'iron_ingot', 'steel_ingot',
          'chemical', 'ammo_9mm', 'ammo_556', 'ammo_762', 'bandage', 'medkit',
          'gun_smg_1', 'gun_shotgun_1', 'gun_sniper_0', 'melee_steel_ingot_4'
        ];
        for (let i = 0; i < 3; i++) {
          const pick = pool[Math.floor(Math.random() * pool.length)];
          const qty = pick.startsWith('ammo_') ? 18 : 2;
          this.addItem(pick, qty);
          const def = GameCatalog.items[pick];
          if (def) onToast(`📦 Олдлоо: +${qty} ${def.name}`);
        }
      }

      tryLootNearby(onToast) {
        for (const crate of this.world.lootCrates) {
          if (!crate.opened && crate.pos.distanceTo(this.pos) < 3.8) {
            this.openCrateOrBarrel(crate, onToast);
            return true;
          }
        }
        return false;
      }

      getBuildPreviewPos() {
        const fwd = new THREE.Vector3(-Math.sin(this.yaw), 0, -Math.cos(this.yaw));
        return this.pos.clone().addScaledVector(fwd, 3.6);
      }

      getSnappedBuildYaw() {
        return Math.round(this.yaw / (Math.PI / 2)) * (Math.PI / 2) + this.buildYawOffset;
      }

      update(dt, input, time) {
        if (this.fireCooldown > 0) this.fireCooldown -= dt;

        if (this.isSwinging) {
          this.swingProgress += dt * 4.2;
          if (this.swingProgress >= 1) {
            this.isSwinging = false;
            this.swingProgress = 0;
          }
        }

        // Smooth ADS Camera FOV Zoom
        const targetFOV = this.isADS ? 42 : 72;
        this.camera.fov += (targetFOV - this.camera.fov) * Math.min(1, dt * 14);
        this.camera.updateProjectionMatrix();

        // Update bullet tracers
        for (let i = this.tracers.length - 1; i >= 0; i--) {
          this.tracers[i].life -= dt;
          if (this.tracers[i].life <= 0) {
            this.scene.remove(this.tracers[i].mesh);
            this.tracers.splice(i, 1);
          }
        }

        // Survival Hunger & Thirst gradual drain
        this.hunger = Math.max(0, this.hunger - dt * 0.1);
        this.thirst = Math.max(0, this.thirst - dt * 0.14);
        if (this.hunger <= 0 || this.thirst <= 0) {
          this.hp = Math.max(1, this.hp - dt * 1.0);
        }

        // Camera Look
        const sensMult = this.isADS ? 0.55 : 1.0;
        this.yaw -= input.lookX * sensMult;
        this.pitch = Math.max(-1.45, Math.min(1.45, this.pitch - input.lookY * sensMult));

        // Movement
        const speed = input.sprint ? 9.6 : 5.6;
        const fwdX = -Math.sin(this.yaw), fwdZ = -Math.cos(this.yaw);
        const rgtX = Math.cos(this.yaw), rgtZ = -Math.sin(this.yaw);

        const wishX = fwdX * -input.moveY + rgtX * input.moveX;
        const wishZ = fwdZ * -input.moveY + rgtZ * input.moveX;

        this.vel.x += (wishX * speed - this.vel.x) * Math.min(1, dt * 13);
        this.vel.z += (wishZ * speed - this.vel.z) * Math.min(1, dt * 13);

        if (input.jump && this.isGrounded) {
          this.vel.y = 7.8;
          this.isGrounded = false;
        }
        this.vel.y -= 21.0 * dt;

        this.pos.x = Math.max(-1995, Math.min(1995, this.pos.x + this.vel.x * dt));
        this.resolveHorizontal('x');

        this.pos.z = Math.max(-1995, Math.min(1995, this.pos.z + this.vel.z * dt));
        this.resolveHorizontal('z');

        this.pos.y += this.vel.y * dt;
        this.resolveVertical();

        this.camera.position.set(this.pos.x, this.pos.y + 1.62, this.pos.z);
        this.camera.rotation.y = this.yaw;
        this.camera.rotation.x = this.pitch;

        const horizSpeed = Math.hypot(this.vel.x, this.vel.z);
        this.viewmodel.update(dt, this.isADS, this.swingProgress, horizSpeed, time);

        // Building Hologram Preview
        const eq = this.getEquippedItem();
        if (eq && eq.type === 'building') {
          const p = this.getBuildPreviewPos();
          const gx = Math.round(p.x / 3) * 3;
          const gz = Math.round(p.z / 3) * 3;
          const gy = this.world.getTerrainHeight(gx, gz);
          this.buildGhost.visible = true;
          this.buildGhost.scale.set(eq.w / 3, eq.h / 3, eq.d / 0.4);
          this.buildGhost.position.set(gx, gy + eq.h / 2, gz);
          this.buildGhost.rotation.y = this.getSnappedBuildYaw();
        } else {
          this.buildGhost.visible = false;
        }
      }

      resolveHorizontal(axis) {
        const feetY = this.pos.y + 0.18;
        const headY = this.pos.y + 1.72;
        for (const b of this.world.colliders) {
          if (b.disabled || headY <= b.minY || feetY >= b.maxY) continue;
          if (this.pos.x + this.radius > b.minX && this.pos.x - this.radius < b.maxX &&
              this.pos.z + this.radius > b.minZ && this.pos.z - this.radius < b.maxZ) {
            if (axis === 'x') {
              this.pos.x = this.vel.x > 0 ? b.minX - this.radius : b.maxX + this.radius;
              this.vel.x = 0;
            } else {
              this.pos.z = this.vel.z > 0 ? b.minZ - this.radius : b.maxZ + this.radius;
              this.vel.z = 0;
            }
          }
        }
      }

      resolveVertical() {
        this.isGrounded = false;
        const ty = this.world.getTerrainHeight(this.pos.x, this.pos.z);
        if (this.pos.y <= ty) {
          this.pos.y = ty;
          this.vel.y = 0;
          this.isGrounded = true;
        }
        for (const b of this.world.colliders) {
          if (b.disabled) continue;
          if (this.pos.x + 0.35 > b.minX && this.pos.x - 0.35 < b.maxX &&
              this.pos.z + 0.35 > b.minZ && this.pos.z - 0.35 < b.maxZ) {
            if (this.vel.y <= 0 && this.pos.y <= b.maxY && this.pos.y >= b.maxY - 0.45) {
              this.pos.y = b.maxY;
              this.vel.y = 0;
              this.isGrounded = true;
            }
          }
        }
      }
    }

    // =========================================================
    // 8. MAIN ENGINE, PROCEDURAL SKY DOME & UI CONTROLLER
    // =========================================================
    class GameController {
      constructor() {
        this.sfx = new SoundFX();

        this.scene = new THREE.Scene();
        this.scene.fog = new THREE.FogExp2(0x7d8c94, 0.0068);

        this.camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 280);
        this.camera.rotation.order = 'YXZ';

        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.08;
        document.getElementById('game-container').appendChild(this.renderer.domElement);

        this.setupRealisticAtmosphere();

        this.world = new ChunkWorld(this.scene);
        this.zombieMgr = new ZombieManager(this.scene, this.world);
        this.player = new PlayerSystem(this.camera, this.scene, this.world, this.zombieMgr, this.sfx);

        this.input = { moveX: 0, moveY: 0, lookX: 0, lookY: 0, jump: false, sprint: false };
        this.isHoldingUse = false;
        this.joyId = null;
        this.lookId = null;
        this.lastLook = { x: 0, y: 0 };

        this.activeModalTab = 'inv';
        this.craftCategory = 'ALL';
        this.craftSearch = '';

        this.bindControls();
        this.renderHotbar();

        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        this.clock = new THREE.Clock();
        this.elapsed = 0;
        this.fpsFrames = 0;
        this.fpsTime = 0;
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
      }

      setupRealisticAtmosphere() {
        // Procedural Sky Dome with Horizon Glow & Sun Disc
        const skyGeo = new THREE.SphereGeometry(240, 24, 16);
        const skyMat = new THREE.ShaderMaterial({
          side: THREE.BackSide,
          depthWrite: false,
          uniforms: {
            topColor: { value: new THREE.Color(0x2c4b66) },
            horizonColor: { value: new THREE.Color(0x9aa7ad) },
            sunDir: { value: new THREE.Vector3(0.5, 0.55, 0.4).normalize() }
          },
          vertexShader: `
            varying vec3 vWorldPos;
            void main() {
              vec4 wp = modelMatrix * vec4(position, 1.0);
              vWorldPos = wp.xyz;
              gl_Position = projectionMatrix * viewMatrix * wp;
            }
          `,
          fragmentShader: `
            uniform vec3 topColor;
            uniform vec3 horizonColor;
            uniform vec3 sunDir;
            varying vec3 vWorldPos;
            void main() {
              vec3 dir = normalize(vWorldPos);
              float h = clamp(dir.y, 0.0, 1.0);
              vec3 col = mix(horizonColor, topColor, pow(h, 0.55));
              float sunAmt = max(dot(dir, sunDir), 0.0);
              col += vec3(1.0, 0.85, 0.6) * pow(sunAmt, 48.0) * 0.9;
              gl_FragColor = vec4(col, 1.0);
            }
          `
        });
        this.skyDome = new THREE.Mesh(skyGeo, skyMat);
        this.scene.add(this.skyDome);

        this.hemi = new THREE.HemisphereLight(0xdbeafe, 0x3f3a32, 0.95);
        this.sun = new THREE.DirectionalLight(0xfff0d4, 1.65);
        this.sun.castShadow = true;
        this.sun.shadow.mapSize.set(1024, 1024);
        const d = 55;
        this.sun.shadow.camera.left = -d; this.sun.shadow.camera.right = d;
        this.sun.shadow.camera.top = d; this.sun.shadow.camera.bottom = -d;
        this.sun.shadow.bias = -0.0005;
        this.scene.add(this.hemi, this.sun, this.sun.target);
      }

      showToast(msg) {
        const box = document.getElementById('toast-box');
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        box.appendChild(el);
        if (box.children.length > 4) box.firstChild.remove();
        setTimeout(() => el.remove(), 1150);
      }

      bindControls() {
        const joyZone = document.getElementById('joystick-zone');
        const joyBase = document.getElementById('joystick-base');
        const joyStick = document.getElementById('joystick-stick');
        const lookZone = document.getElementById('look-zone');

        joyZone.addEventListener('touchstart', (e) => {
          e.preventDefault();
          this.sfx.unlock();
          if (this.joyId !== null) return;
          const t = e.changedTouches[0];
          this.joyId = t.identifier;
          this.moveJoy(t.clientX, t.clientY, joyBase, joyStick);
        }, { passive: false });

        joyZone.addEventListener('touchmove', (e) => {
          e.preventDefault();
          for (const t of e.changedTouches) {
            if (t.identifier === this.joyId) this.moveJoy(t.clientX, t.clientY, joyBase, joyStick);
          }
        }, { passive: false });

        const endJoy = (e) => {
          for (const t of e.changedTouches) {
            if (t.identifier === this.joyId) {
              this.joyId = null;
              this.input.moveX = 0;
              this.input.moveY = 0;
              joyStick.style.transform = 'translate(0,0)';
            }
          }
        };
        joyZone.addEventListener('touchend', endJoy);
        joyZone.addEventListener('touchcancel', endJoy);

        lookZone.addEventListener('touchstart', (e) => {
          e.preventDefault();
          this.sfx.unlock();
          if (this.lookId !== null) return;
          const t = e.changedTouches[0];
          this.lookId = t.identifier;
          this.lastLook = { x: t.clientX, y: t.clientY };
        }, { passive: false });

        lookZone.addEventListener('touchmove', (e) => {
          e.preventDefault();
          for (const t of e.changedTouches) {
            if (t.identifier === this.lookId) {
              this.input.lookX += (t.clientX - this.lastLook.x) * 0.0046;
              this.input.lookY += (t.clientY - this.lastLook.y) * 0.0046;
              this.lastLook = { x: t.clientX, y: t.clientY };
            }
          }
        }, { passive: false });

        const endLook = (e) => {
          for (const t of e.changedTouches) {
            if (t.identifier === this.lookId) this.lookId = null;
          }
        };
        lookZone.addEventListener('touchend', endLook);
        lookZone.addEventListener('touchcancel', endLook);

        // Reliable Single-Fire Tap Helper (Prevents Touch+Click double trigger)
        const tap = (id, fn) => {
          const el = document.getElementById(id);
          let lastTouch = 0;
          el.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            lastTouch = Date.now();
            this.sfx.unlock();
            fn(el);
          }, { passive: false });
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            if (Date.now() - lastTouch < 400) return;
            this.sfx.unlock();
            fn(el);
          });
        };

        // Main Action / Fire / Use Button (Supports both Tap and Continuous Hold!)
        const btnUse = document.getElementById('btn-use');
        let lastUseTouch = 0;
        const startUse = (e) => {
          e.preventDefault();
          e.stopPropagation();
          this.sfx.unlock();
          this.isHoldingUse = true;
          this.player.useActiveItem(
            false,
            (m) => this.showToast(m),
            (z) => this.handleZombieKilled(z)
          );
          this.renderHotbar();
        };
        const stopUse = (e) => {
          if (e) e.stopPropagation();
          this.isHoldingUse = false;
        };

        btnUse.addEventListener('touchstart', (e) => { lastUseTouch = Date.now(); startUse(e); }, { passive: false });
        btnUse.addEventListener('touchend', stopUse);
        btnUse.addEventListener('touchcancel', stopUse);
        btnUse.addEventListener('mousedown', (e) => { if (Date.now() - lastUseTouch > 400) startUse(e); });
        btnUse.addEventListener('mouseup', stopUse);
        btnUse.addEventListener('mouseleave', stopUse);

        // ADS Scope Zoom / Rotate Building Button
        tap('btn-ads', (el) => {
          const eq = this.player.getEquippedItem();
          if (eq && eq.type === 'building') {
            this.player.buildYawOffset += Math.PI / 2;
            this.showToast('🔄 Барилгыг 90° эргүүллээ');
          } else if (eq && eq.type === 'gun') {
            this.player.isADS = !this.player.isADS;
            el.classList.toggle('active', this.player.isADS);
            document.getElementById('crosshair').classList.toggle('ads', this.player.isADS);
          } else {
            this.showToast('🎯 Дуран зөвхөн буун дээр ажиллана');
          }
        });

        tap('btn-reload', () => this.player.reloadGun((m) => this.showToast(m)));

        tap('btn-loot', () => {
          if (this.player.tryLootNearby((m) => this.showToast(m))) {
            this.renderHotbar();
          } else {
            this.showToast('📦 Ойр хавьд Rust торх/хайрцаг алга');
          }
        });

        tap('btn-jump', () => { this.input.jump = true; });
        tap('btn-sprint', (el) => {
          this.input.sprint = !this.input.sprint;
          el.classList.toggle('active', this.input.sprint);
        });
        tap('btn-light', (el) => {
          this.player.flashlight.visible = !this.player.flashlight.visible;
          el.classList.toggle('active', this.player.flashlight.visible);
        });
        tap('btn-fs', () => {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
          else document.exitFullscreen().catch(() => {});
        });

        tap('btn-open-bag', () => {
          this.isHoldingUse = false;
          document.getElementById('modal-overlay').classList.add('open');
          this.renderModal();
        });
        tap('btn-close-modal', () => {
          document.getElementById('modal-overlay').classList.remove('open');
          this.renderHotbar();
        });

        document.querySelectorAll('.tab-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            this.activeModalTab = btn.dataset.tab;
            this.renderModal();
          });
        });
      }

      moveJoy(tx, ty, base, stick) {
        const r = base.getBoundingClientRect();
        let dx = tx - (r.left + r.width / 2);
        let dy = ty - (r.top + r.height / 2);
        const dist = Math.hypot(dx, dy);
        if (dist > 40) { dx = (dx / dist) * 40; dy = (dy / dist) * 40; }
        stick.style.transform = `translate(${dx}px, ${dy}px)`;
        this.input.moveX = Math.abs(dx / 40) < 0.12 ? 0 : dx / 40;
        this.input.moveY = Math.abs(dy / 40) < 0.12 ? 0 : dy / 40;
      }

      handleZombieKilled(z) {
        this.showToast(`💀 ${z.def.name} устгагдлаа!`);
        this.player.addItem('zombie_blood', 1);
        if (z.isBoss) {
          this.player.addItem('boss_core', 1);
          this.player.addItem('titanium_ore', 3);
          this.showToast('🔮 BOSS CORE + Титан уналаа!');
        } else if (Math.random() > 0.55) {
          this.player.addItem('mutant_gland', 1);
        }
        this.renderHotbar();
      }

      renderHotbar() {
        const bar = document.getElementById('hotbar');
        bar.innerHTML = '';
        for (let i = 0; i < 8; i++) {
          const slot = document.createElement('div');
          slot.className = 'hotbar-slot' + (i === this.player.selectedSlot ? ' selected' : '');
          const id = this.player.hotbar[i];
          const item = id ? GameCatalog.items[id] : null;
          const qty = id ? (this.player.inventory[id] || 0) : 0;

          if (item && qty > 0) {
            slot.innerHTML = `
              <span class="slot-qty">${qty}</span>
              <span>${item.icon}</span>
              <span class="slot-name">${item.name.split(' ')[0]}</span>
            `;
          } else {
            slot.innerHTML = `<span style="color:#475569;font-size:10px;">${i + 1}</span>`;
          }

          let lastSlotTouch = 0;
          const selectSlot = (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.player.selectedSlot = i;
            this.player.refreshEquipped();
            this.renderHotbar();
          };
          slot.addEventListener('touchstart', (e) => { lastSlotTouch = Date.now(); selectSlot(e); }, { passive: false });
          slot.addEventListener('click', (e) => { if (Date.now() - lastSlotTouch > 400) selectSlot(e); });
          bar.appendChild(slot);
        }

        // Update Main Action Button & Banner dynamically for Equipped Item
        const eq = this.player.getEquippedItem();
        const btnUse = document.getElementById('btn-use');
        const btnAds = document.getElementById('btn-ads');
        const banner = document.getElementById('held-info-banner');

        if (!eq) {
          btnUse.innerHTML = '👊<br/>ЦОХИХ';
          btnUse.style.background = 'rgba(71, 85, 105, 0.85)';
          btnAds.innerHTML = '🎯<br/>ДУРАН';
          banner.textContent = 'Гарт: Хоосон гар';
        } else if (eq.type === 'gun') {
          btnUse.innerHTML = '🔫<br/>БУУДАХ';
          btnUse.style.background = 'rgba(220, 38, 38, 0.9)';
          btnAds.innerHTML = '🎯<br/>ДУРАН';
          const mag = this.player.magAmmo[eq.id] ?? eq.magSize;
          const res = this.player.inventory[eq.ammoType] || 0;
          banner.textContent = `${eq.name} | Сум: ${mag} / ${res}`;
        } else if (eq.type === 'tool' || eq.type === 'melee') {
          btnUse.innerHTML = '🪓<br/>ЦАВЧИХ';
          btnUse.style.background = 'rgba(217, 119, 6, 0.9)';
          btnAds.innerHTML = '🎯<br/>ДУРАН';
          banner.textContent = `${eq.name} | Хүч: ${eq.damage || eq.power}`;
        } else if (eq.type === 'consumable') {
          btnUse.innerHTML = '🩹<br/>ХЭРЭГЛЭХ';
          btnUse.style.background = 'rgba(22, 163, 74, 0.92)';
          banner.textContent = `${eq.name} (${eq.desc})`;
        } else if (eq.type === 'building') {
          btnUse.innerHTML = '🧱<br/>БАРИХ';
          btnUse.style.background = 'rgba(2, 132, 199, 0.92)';
          btnAds.innerHTML = '🔄<br/>ЭРГҮҮЛ';
          banner.textContent = `Барих: ${eq.name} [БАРИХ дарна уу]`;
        }
      }

      renderModal() {
        const container = document.getElementById('modal-content');
        if (this.activeModalTab === 'inv') {
          let html = `<div class="grid-list">`;
          const entries = Object.entries(this.player.inventory).filter(([, q]) => q > 0);
          if (entries.length === 0) html += `<p>Цүнх хоосон байна.</p>`;

          for (const [id, qty] of entries) {
            const it = GameCatalog.items[id];
            if (!it) continue;

            let actionButtons = '';
            if (it.type === 'consumable') {
              actionButtons = `
                <button class="card-btn use-now" data-use="${id}">✨ ХЭРЭГЛЭХ</button>
                <button class="card-btn equip" data-equip="${id}">✋ ГАРТ БАРИХ</button>
              `;
            } else if (it.type === 'armor') {
              actionButtons = `<button class="card-btn use-now" data-use="${id}">🦺 ӨМСӨХ</button>`;
            } else if (['gun', 'melee', 'tool', 'building'].includes(it.type)) {
              actionButtons = `<button class="card-btn equip" data-equip="${id}">✋ ГАРТ БАРИХ</button>`;
            }

            html += `
              <div class="card">
                <div class="card-info">
                  <div class="card-title">${it.icon} ${it.name} (x${qty})</div>
                  <div class="card-sub">${it.desc || ''}</div>
                </div>
                <div class="card-actions">${actionButtons}</div>
              </div>
            `;
          }
          html += `</div>`;
          container.innerHTML = html;

          container.querySelectorAll('[data-use]').forEach((btn) => {
            btn.addEventListener('click', () => {
              this.player.useOrEquipItemById(btn.dataset.use, (m) => this.showToast(m));
              this.renderModal();
              this.renderHotbar();
            });
          });

          container.querySelectorAll('[data-equip]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const id = btn.dataset.equip;
              this.player.hotbar[this.player.selectedSlot] = id;
              this.player.refreshEquipped();
              this.renderHotbar();
              this.showToast(`✋ Гарт барилаа: ${GameCatalog.items[id].name}`);
            });
          });
        } else if (this.activeModalTab === 'craft') {
          const cats = ['ALL', 'Weapon', 'Ammo', 'Building', 'Armor', 'Survival', 'Tool', 'Material'];
          const catNames = { ALL: 'Бүгд (520)', Weapon: 'Зэвсэг', Ammo: 'Сум', Building: 'Барилга', Armor: 'Хуяг', Survival: 'Эм/Хоол', Tool: 'Багаж', Material: 'Материал' };

          let html = `<div class="filter-bar">
            <input id="craft-search" type="text" placeholder="🔍 Нэрээр хайх..." value="${this.craftSearch}" />
            ${cats.map((c) => `<button class="cat-pill ${this.craftCategory === c ? 'active' : ''}" data-cat="${c}">${catNames[c]}</button>`).join('')}
          </div><div class="grid-list">`;

          const filtered = GameCatalog.recipes.filter((r) => {
            if (this.craftCategory !== 'ALL' && r.cat !== this.craftCategory) return false;
            if (this.craftSearch && !r.name.toLowerCase().includes(this.craftSearch.toLowerCase())) return false;
            return true;
          });

          for (const rec of filtered.slice(0, 120)) {
            const reqEntries = Object.entries(rec.reqs);
            const canCraft = reqEntries.every(([rid, amt]) => (this.player.inventory[rid] || 0) >= amt);
            const reqText = reqEntries
              .map(([rid, amt]) => {
                const have = this.player.inventory[rid] || 0;
                const rName = GameCatalog.items[rid]?.name.split(' ')[0] || rid;
                return `${rName}: ${have}/${amt}`;
              })
              .join(' | ');

            html += `
              <div class="card">
                <div class="card-info">
                  <div class="card-title">${rec.icon} ${rec.name} (x${rec.outQty})</div>
                  <div class="card-sub">${reqText}</div>
                </div>
                <button class="card-btn ${canCraft ? '' : 'disabled'}" data-craft="${rec.id}">УРЛАХ</button>
              </div>
            `;
          }
          html += `</div>`;
          container.innerHTML = html;

          const searchInput = document.getElementById('craft-search');
          searchInput.addEventListener('input', (e) => {
            this.craftSearch = e.target.value;
            this.renderModal();
            const inp = document.getElementById('craft-search');
            inp.focus();
            inp.setSelectionRange(inp.value.length, inp.value.length);
          });

          container.querySelectorAll('.cat-pill').forEach((p) => {
            p.addEventListener('click', () => {
              this.craftCategory = p.dataset.cat;
              this.renderModal();
            });
          });

          container.querySelectorAll('[data-craft]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const rec = GameCatalog.recipes.find((r) => r.id === btn.dataset.craft);
              if (!rec) return;
              const ok = Object.entries(rec.reqs).every(([rid, amt]) => (this.player.inventory[rid] || 0) >= amt);
              if (!ok) {
                this.showToast('❌ Материал хүрэлцэхгүй байна!');
                return;
              }
              for (const [rid, amt] of Object.entries(rec.reqs)) {
                this.player.removeItem(rid, amt);
              }
              this.player.addItem(rec.id, rec.outQty);
              this.sfx.playUseItem();
              this.showToast(`🔨 Урлалаа: ${rec.name}`);
              this.renderModal();
              this.renderHotbar();
            });
          });
        } else if (this.activeModalTab === 'zombies') {
          let html = `<h4 style="color:#fbbf24;margin-bottom:6px;">👑 20 ТӨРЛИЙН BOSS ZOMBIE</h4><div class="grid-list" style="margin-bottom:12px;">`;
          for (const b of GameCatalog.bossTypes) {
            html += `<div class="card" style="border-color:#dc2626;"><div class="card-info"><div class="card-title" style="color:#fca5a5;">${b.name}</div><div class="card-sub">HP: ${b.hp} | Хурд: ${b.speed} | Цохилт: ${b.dmg}</div></div></div>`;
          }
          html += `</div><h4 style="color:#84cc16;margin-bottom:6px;">🧟 20 ТӨРЛИЙН ЭНГИЙН ЗОМБИ</h4><div class="grid-list">`;
          for (const z of GameCatalog.zombieTypes) {
            html += `<div class="card"><div class="card-info"><div class="card-title">${z.name}</div><div class="card-sub">HP: ${z.hp} | Хурд: ${z.speed} | Цохилт: ${z.dmg}</div></div></div>`;
          }
          html += `</div>`;
          container.innerHTML = html;
        }
      }

      loop() {
        requestAnimationFrame(this.loop);
        const dt = Math.min(this.clock.getDelta(), 0.05);
        this.elapsed += dt;

        // Continuous automatic firing or continuous chopping/mining while button is held
        if (this.isHoldingUse) {
          this.player.useActiveItem(
            true,
            (m) => this.showToast(m),
            (z) => this.handleZombieKilled(z)
          );
          this.renderHotbar();
        }

        this.world.updateChunks(this.player.pos);
        this.player.update(dt, this.input, this.elapsed);
        this.input.lookX = 0;
        this.input.lookY = 0;
        this.input.jump = false;

        this.skyDome.position.copy(this.player.pos);
        this.sun.position.set(this.player.pos.x + 45, 70, this.player.pos.z + 35);
        this.sun.target.position.copy(this.player.pos);

        this.zombieMgr.update(
          dt,
          this.player.pos,
          (dmg, zName) => {
            const finalDmg = Math.max(2, dmg - Math.floor(this.player.armor * 0.25));
            this.player.hp -= finalDmg;
            const vig = document.getElementById('damage-vignette');
            vig.style.opacity = '1';
            setTimeout(() => { vig.style.opacity = '0'; }, 240);
            this.showToast(`💥 ${zName} цохилоо (-${finalDmg} HP)`);

            if (this.player.hp <= 0) {
              this.player.hp = this.player.maxHp;
              this.player.hunger = 100;
              this.player.thirst = 100;
              this.player.pos.set(0, 0, 5);
              this.showToast('🏥 Safe Zone дээр дахин төрлөө!');
            }
          },
          (boss) => this.showToast(`⚠️ АНХААР! ${boss.def.name} гарч ирлээ!`)
        );

        this.world.update(dt, this.zombieMgr);
        this.renderer.render(this.scene, this.camera);
        this.updateHUD(dt);
      }

      updateHUD(dt) {
        document.getElementById('hp-fill').style.width = `${Math.min(100, (this.player.hp / this.player.maxHp) * 100)}%`;
        document.getElementById('hp-text').textContent = Math.ceil(this.player.hp);
        document.getElementById('thirst-fill').style.width = `${this.player.thirst}%`;
        document.getElementById('thirst-text').textContent = Math.ceil(this.player.thirst);
        document.getElementById('hunger-fill').style.width = `${this.player.hunger}%`;
        document.getElementById('hunger-text').textContent = Math.ceil(this.player.hunger);
        document.getElementById('armor-fill').style.width = `${this.player.armor}%`;
        document.getElementById('armor-text').textContent = this.player.armor;

        const activeBoss = this.zombieMgr.zombies.find((z) => z.isBoss);
        const bossWrap = document.getElementById('boss-bar-wrap');
        if (activeBoss) {
          bossWrap.style.display = 'block';
          document.getElementById('boss-name').textContent = `${activeBoss.def.name} [${Math.ceil(activeBoss.hp)}/${activeBoss.maxHp}]`;
          document.getElementById('boss-hp-fill').style.width = `${Math.max(0, (activeBoss.hp / activeBoss.maxHp) * 100)}%`;
        } else {
          bossWrap.style.display = 'none';
        }

        const nearCrate = this.world.lootCrates.find((c) => !c.opened && c.pos.distanceTo(this.player.pos) < 3.8);
        const promptEl = document.getElementById('target-prompt');
        if (nearCrate) {
          promptEl.style.display = 'block';
          promptEl.textContent = nearCrate.isCrate ? '📦 Цэргийн Loot Хайрцаг [LOOT дарна уу]' : '🛢️ Rust Торх [LOOT эсвэл Сүхээр цохино уу]';
        } else {
          promptEl.style.display = 'none';
        }

        this.fpsFrames++;
        this.fpsTime += dt;
        if (this.fpsTime >= 0.4) {
          const fps = Math.round(this.fpsFrames / this.fpsTime);
          this.fpsFrames = 0;
          this.fpsTime = 0;
          const px = Math.round(this.player.pos.x);
          const pz = Math.round(this.player.pos.z);
          document.getElementById('zone-label').textContent = this.world.getBiomeAt(px, pz);
          document.getElementById('coord-label').textContent = `X: ${px} | Z: ${pz} | ${fps} FPS`;
        }
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', () => new GameController());
    } else {
      new GameController();
    }
  </script>
</body>
</html>
