<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Rust Horizon 3D - Realistic Survival RPG</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b0d;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #f1f5f9;
    }

    #game-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Subtle Blood Vignette on Damage */
    #damage-vignette {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(circle, transparent 55%, rgba(185, 28, 28, 0.65) 100%);
      opacity: 0;
      transition: opacity 0.2s ease-out;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* Rust-Style Bottom-Left Survival Bars */
    #rust-vitals {
      position: absolute;
      bottom: 8px;
      left: 8px;
      width: 156px;
      background: rgba(14, 17, 20, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 5px;
      padding: 5px 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 15;
    }

    .vital-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
    }

    .vital-bar {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
    }

    .vital-fill {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease;
    }

    #hp-fill { background: #65a30d; }
    #thirst-fill { background: #0284c7; }
    #hunger-fill { background: #d97706; }
    #armor-fill { background: #94a3b8; }

    /* Top Left Compass & Zone Telemetry */
    #top-telemetry {
      position: absolute;
      top: 8px;
      left: 10px;
      background: rgba(12, 15, 18, 0.76);
      border-left: 3px solid #ea580c;
      padding: 5px 9px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.35;
    }

    #zone-label { color: #84cc16; font-size: 11px; }
    #coord-label { color: #cbd5e1; }

    /* Boss Health Bar */
    #boss-bar-wrap {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 270px;
      background: rgba(24, 8, 10, 0.88);
      border: 1.5px solid #dc2626;
      border-radius: 6px;
      padding: 5px 10px;
      display: none;
      text-align: center;
      box-shadow: 0 0 16px rgba(220, 38, 38, 0.5);
    }

    #boss-name {
      font-size: 11px;
      font-weight: 900;
      color: #fecaca;
      margin-bottom: 3px;
    }

    #boss-hp-track {
      width: 100%;
      height: 8px;
      background: #2b0d10;
      border-radius: 4px;
      overflow: hidden;
    }

    #boss-hp-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #b91c1c, #ea580c);
    }

    /* Top Right Controls */
    #top-right-controls {
      position: absolute;
      top: 8px;
      right: 10px;
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .top-btn {
      background: rgba(18, 22, 27, 0.86);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 800;
    }

    .top-btn:active, .top-btn.active {
      background: #ea580c;
      border-color: #fff;
    }

    #btn-open-bag {
      background: linear-gradient(135deg, #b45309, #d97706);
      border-color: #fde047;
    }

    /* Dynamic Crosshair & Hit Marker */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 255, 255, 0.88);
      border-radius: 50%;
      box-shadow: 0 0 4px #000;
      transition: transform 0.08s ease, border-color 0.08s ease;
    }

    #crosshair.hit {
      border-color: #ef4444;
      transform: translate(-50%, -50%) scale(1.65);
    }

    #crosshair.ads {
      width: 5px;
      height: 5px;
      background: #ef4444;
      border-color: #ef4444;
    }

    #target-prompt {
      position: absolute;
      top: calc(50% + 18px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 15, 18, 0.88);
      border: 1px solid rgba(250, 204, 21, 0.55);
      color: #fef08a;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      display: none;
      white-space: nowrap;
    }

    #held-info-banner {
      position: absolute;
      bottom: 62px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 15, 18, 0.78);
      padding: 3px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      white-space: nowrap;
    }

    /* Toast Notifications */
    #toast-box {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .toast {
      background: rgba(14, 20, 18, 0.9);
      border: 1px solid #84cc16;
      color: #bef264;
      padding: 3px 11px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      animation: fadeUp 1.15s ease-out forwards;
    }

    @keyframes fadeUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-18px); }
    }

    /* Rust 6-Slot / 8-Slot Bottom Hotbar */
    #hotbar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: rgba(14, 17, 20, 0.85);
      padding: 4px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      pointer-events: auto;
      z-index: 15;
    }

    .hotbar-slot {
      width: 44px;
      height: 46px;
      background: rgba(30, 36, 44, 0.82);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 17px;
    }

    .hotbar-slot.selected {
      border-color: #38bdf8;
      background: rgba(2, 132, 199, 0.35);
      transform: translateY(-2px);
    }

    .slot-name {
      font-size: 8px;
      font-weight: 800;
      max-width: 40px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #f1f5f9;
    }

    .slot-qty {
      position: absolute;
      top: 1px;
      right: 3px;
      font-size: 9px;
      font-weight: 900;
      color: #fde047;
    }

    /* Left Joystick Zone */
    #joystick-zone {
      position: absolute;
      left: 0;
      top: 48px;
      bottom: 92px;
      width: 34%;
      pointer-events: auto;
    }

    #joystick-base {
      position: absolute;
      left: 26px;
      bottom: 14px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joystick-stick {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(241, 245, 249, 0.65);
      border: 2px solid #fff;
    }

    /* Right Camera Look Zone */
    #look-zone {
      position: absolute;
      right: 0;
      top: 0;
      width: 66%;
      height: 100%;
      pointer-events: auto;
    }

    /* Right Thumb Action Pad */
    #action-pad {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: grid;
      grid-template-columns: repeat(3, 54px);
      gap: 7px;
      pointer-events: none;
      z-index: 15;
    }

    .act-btn {
      pointer-events: auto;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(16, 20, 25, 0.78);
      border: 2px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      font-size: 9.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.15;
    }

    .act-btn:active, .act-btn.active {
      background: #ea580c;
      border-color: #fff;
      transform: scale(0.92);
    }

    #btn-use {
      width: 62px;
      height: 62px;
      background: rgba(220, 38, 38, 0.88);
      border-color: #fca5a5;
      font-size: 10.5px;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.5);
    }

    #btn-loot {
      background: rgba(217, 119, 6, 0.88);
      border-color: #fde047;
    }

    /* ==========================================
       INVENTORY & 520-ITEM CRAFTING MODAL
       ========================================== */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(8, 11, 15, 0.94);
      pointer-events: auto;
      padding: 10px;
      flex-direction: column;
    }

    #modal-overlay.open { display: flex; }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      padding-bottom: 7px;
      margin-bottom: 8px;
    }

    .modal-tabs {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
    }

    .tab-btn.active {
      background: #d97706;
      color: #fff;
      border-color: #fde047;
    }

    #btn-close-modal {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 12px;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      touch-action: pan-y;
      padding-right: 4px;
    }

    .modal-body * { touch-action: pan-y; }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 8px;
    }

    #craft-search {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      width: 155px;
      user-select: text;
      -webkit-user-select: text;
    }

    .cat-pill {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
    }

    .cat-pill.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }

    .grid-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 6px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 6px;
      padding: 7px 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-title {
      font-size: 11.5px;
      font-weight: 800;
      color: #f8fafc;
    }

    .card-sub {
      font-size: 10px;
      color: #94a3b8;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-btn {
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 10.5px;
      font-weight: 800;
      white-space: nowrap;
    }

    .card-btn.disabled {
      background: #334155;
      color: #64748b;
    }

    .card-btn.equip { background: #2563eb; }
    .card-btn.use-now { background: #16a34a; }

    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #090b0c;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    @media screen and (orientation: portrait) {
      #rotate-overlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="damage-vignette"></div>

  <div id="rotate-overlay">
    <div>
      <h2 style="color:#ea580c; margin-bottom:8px;">УТСАА ХЭВТҮҮЛНЭ ҮҮ</h2>
      <p style="color:#94a3b8; font-size:14px;">Rust 3D Survival тоглохын тулд утсаа хэвтээ болгоно уу.</p>
    </div>
  </div>

  <!-- MAIN HUD -->
  <div id="hud">
    <!-- Top Left Zone & Coords -->
    <div id="top-telemetry">
      <div id="zone-label">SAFE ZONE (АЮУЛГҮЙ БҮС)</div>
      <div id="coord-label">X: 0 | Z: 0 | 60 FPS</div>
    </div>

    <!-- Rust-Style Bottom-Left Vitals -->
    <div id="rust-vitals">
      <div class="vital-row">❤️ <div class="vital-bar"><div id="hp-fill" class="vital-fill"></div></div> <span id="hp-text">100</span></div>
      <div class="vital-row">💧 <div class="vital-bar"><div id="thirst-fill" class="vital-fill"></div></div> <span id="thirst-text">100</span></div>
      <div class="vital-row">🍖 <div class="vital-bar"><div id="hunger-fill" class="vital-fill"></div></div> <span id="hunger-text">100</span></div>
      <div class="vital-row">🛡️ <div class="vital-bar"><div id="armor-fill" class="vital-fill" style="width:0%"></div></div> <span id="armor-text">0</span></div>
    </div>

    <!-- Active Boss Health Bar -->
    <div id="boss-bar-wrap">
      <div id="boss-name">BOSS ZOMBIE</div>
      <div id="boss-hp-track"><div id="boss-hp-fill"></div></div>
    </div>

    <!-- Top Right Utility Buttons -->
    <div id="top-right-controls">
      <button id="btn-open-bag" class="top-btn" type="button">🎒 ЦҮНХ / CRAFT (520)</button>
      <button id="btn-light" class="top-btn active" type="button">🔦</button>
      <button id="btn-fs" class="top-btn" type="button">⛶</button>
    </div>

    <div id="crosshair"></div>
    <div id="target-prompt">Торх / Хайрцаг нээх [LOOT]</div>
    <div id="held-info-banner">Гарт: Автомат Винтов | Сум: 30 / 90</div>
    <div id="toast-box"></div>

    <!-- 8-Slot Quick Equip Hotbar -->
    <div id="hotbar"></div>

    <!-- Left Touch Joystick -->
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>

    <!-- Right Camera Look Area -->
    <div id="look-zone"></div>

    <!-- Right Thumb Action Pad -->
    <div id="action-pad">
      <button id="btn-ads" class="act-btn" type="button">🎯<br/>ДУРАН</button>
      <button id="btn-loot" class="act-btn" type="button">📦<br/>LOOT</button>
      <button id="btn-use" class="act-btn" type="button">🔫<br/>БУУДАХ</button>
      <button id="btn-reload" class="act-btn" type="button">🔄<br/>ЦЭНЭГ</button>
      <button id="btn-jump" class="act-btn" type="button">⬆️<br/>ҮСРЭХ</button>
      <button id="btn-sprint" class="act-btn" type="button">⚡<br/>ГҮЙХ</button>
    </div>
  </div>

  <!-- INVENTORY, 520 CRAFTING & BESTIARY MODAL -->
  <div id="modal-overlay">
    <div class="modal-header">
      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="inv">🎒 МИНИЙ ЦҮНХ (ХЭРЭГЛЭХ)</button>
        <button class="tab-btn" data-tab="craft">🔨 УРЛАХ (520 ЖОР)</button>
        <button class="tab-btn" data-tab="zombies">🧟 20 ЗОМБИ + 20 BOSS</button>
      </div>
      <button id="btn-close-modal" type="button">✕ ХААХ</button>
    </div>
    <div id="modal-content" class="modal-body"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================
    // 1. PROCEDURAL WEB AUDIO SYNTHESIZER (REALISTIC SFX)
    // =========================================================
    class SoundFX {
      constructor() {
        this.ctx = null;
      }

      unlock() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playGunshot(pitch = 1.0) {
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // Punchy low-end boom
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.16);
        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);

        // Crisp white noise crack
        const bufSize = this.ctx.sampleRate * 0.12;
        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.25));
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.28, now);
        nGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        noise.connect(nGain);
        nGain.connect(this.ctx.destination);
        noise.start(now);
      }

      playImpact(freq = 120) {
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      }

      playReload() {
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [0, 0.14].forEach((offset, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(idx === 0 ? 520 : 780, now + offset);
          gain.gain.setValueAtTime(0.12, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.06);
        });
      }

      playUseItem() {
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.22);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      }
    }

    // =========================================================
    // 2. RUST-STYLE PROCEDURAL PBR TEXTURES (ALBEDO + BUMP MAP)
    // =========================================================
    class PBRTextures {
      static createPBRSet(baseRGB, grain, repeat, style = 'noise') {
        const size = 256;
        const cColor = document.createElement('canvas');
        const cBump = document.createElement('canvas');
        cColor.width = cBump.width = size;
        cColor.height = cBump.height = size;

        const ctx = cColor.getContext('2d');
        const btx = cBump.getContext('2d');

        ctx.fillStyle = `rgb(${baseRGB[0]},${baseRGB[1]},${baseRGB[2]})`;
        ctx.fillRect(0, 0, size, size);
        btx.fillStyle = 'rgb(128,128,128)';
        btx.fillRect(0, 0, size, size);

        // Micro surface detail & bump height
        for (let i = 0; i < 3600; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          const d = (Math.random() - 0.5) * grain;
          ctx.fillStyle = `rgb(${Math.max(0, Math.min(255, baseRGB[0] + d)) | 0},${Math.max(0, Math.min(255, baseRGB[1] + d)) | 0},${Math.max(0, Math.min(255, baseRGB[2] + d)) | 0})`;
          ctx.fillRect(x, y, 3, 3);

          const bVal = Math.max(0, Math.min(255, 128 + d * 1.6)) | 0;
          btx.fillStyle = `rgb(${bVal},${bVal},${bVal})`;
          btx.fillRect(x, y, 3, 3);
        }

        if (style === 'wood') {
          // Wood plank seams & longitudinal grain
          ctx.strokeStyle = 'rgba(25, 14, 6, 0.55)';
          btx.strokeStyle = 'rgb(35, 35, 35)';
          ctx.lineWidth = btx.lineWidth = 3;
          for (let p = 0; p < size; p += 64) {
            ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(size, p); ctx.stroke();
            btx.beginPath(); btx.moveTo(0, p); btx.lineTo(size, p); btx.stroke();
          }
          for (let g = 0; g < 90; g++) {
            const y = Math.random() * size;
            ctx.fillStyle = 'rgba(40, 22, 10, 0.16)';
            ctx.fillRect(0, y, size, 1.5);
            btx.fillStyle = 'rgba(95, 95, 95, 0.35)';
            btx.fillRect(0, y, size, 1.5);
          }
        } else if (style === 'rust') {
          // Rust blotches & metallic scratches
          for (let r = 0; r < 24; r++) {
            const rx = Math.random() * size;
            const ry = Math.random() * size;
            const rad = 8 + Math.random() * 22;
            ctx.fillStyle = 'rgba(138, 54, 20, 0.34)';
            ctx.beginPath(); ctx.arc(rx, ry, rad, 0, Math.PI * 2); ctx.fill();
            btx.fillStyle = 'rgba(85, 85, 85, 0.45)';
            btx.beginPath(); btx.arc(rx, ry, rad, 0, Math.PI * 2); btx.fill();
          }
        } else if (style === 'concrete') {
          // Concrete fractures & formwork lines
          ctx.strokeStyle = 'rgba(20, 24, 28, 0.48)';
          btx.strokeStyle = 'rgb(45, 45, 45)';
          ctx.lineWidth = btx.lineWidth = 2;
          for (let c = 0; c < 10; c++) {
            ctx.beginPath(); btx.beginPath();
            let x = Math.random() * size, y = Math.random() * size;
            ctx.moveTo(x, y); btx.moveTo(x, y);
            for (let s = 0; s < 5; s++) {
              x += (Math.random() - 0.5) * 48;
              y += (Math.random() - 0.5) * 48;
              ctx.lineTo(x, y); btx.lineTo(x, y);
            }
            ctx.stroke(); btx.stroke();
          }
        }

        const map = new THREE.CanvasTexture(cColor);
        const bumpMap = new THREE.CanvasTexture(cBump);
        map.wrapS = map.wrapT = bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
        map.repeat.set(repeat, repeat);
        bumpMap.repeat.set(repeat, repeat);
        return { map, bumpMap };
      }
    }

    class FirstPersonViewmodel {
      constructor(camera) {
        this.camera = camera;
        this.root = new THREE.Group();
        this.weaponPivot = new THREE.Group();
        this.weaponPivot.position.set(0.28, -0.25, -0.45);
        this.root.add(this.weaponPivot);

        // Shared Realistic Materials for Arms, Gloves & Weapons
        const woodPBR = PBRTextures.createPBRSet([112, 72, 42], 32, 2, 'wood');
        const rustPBR = PBRTextures.createPBRSet([52, 58, 64], 38, 2, 'rust');

        this.matSkin = new THREE.MeshStandardMaterial({ color: 0xc69072, roughness: 0.78 });
        this.matSleeve = new THREE.MeshStandardMaterial({ color: 0x3d4939, roughness: 0.9 });
        this.matGlove = new THREE.MeshStandardMaterial({ color: 0x1c1e21, roughness: 0.85 });
        this.matGunMetal = new THREE.MeshStandardMaterial({
          map: rustPBR.map,
          bumpMap: rustPBR.bumpMap,
          bumpScale: 0.015,
          metalness: 0.82,
          roughness: 0.32
        });
        this.matGunWood = new THREE.MeshStandardMaterial({
          map: woodPBR.map,
          bumpMap: woodPBR.bumpMap,
          bumpScale: 0.018,
          roughness: 0.72
        });

        this.buildSurvivorArms();

        // Muzzle Flash & Dynamic Point Light
        this.muzzleFlash = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.11, 0),
          new THREE.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.92 })
        );
        this.muzzleFlash.visible = false;
        this.muzzleLight = new THREE.PointLight(0xffb703, 0, 12);
        this.weaponPivot.add(this.muzzleFlash, this.muzzleLight);

        this.camera.add(this.root);
      }

      buildSurvivorArms() {
        // Right Forearm + Gloved Hand + Fingers (Gripping Weapon/Tool)
        this.rightArm = new THREE.Group();
        const rSleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.062, 0.36, 10), this.matSleeve);
        rSleeve.rotation.x = Math.PI / 2.2;
        rSleeve.position.set(0.05, -0.14, 0.22);

        const rWrist = new THREE.Mesh(new THREE.CylinderGeometry(0.044, 0.05, 0.14, 10), this.matSkin);
        rWrist.rotation.x = Math.PI / 2.1;
        rWrist.position.set(0.02, -0.08, 0.05);

        const rPalm = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.085, 0.095), this.matGlove);
        rPalm.position.set(0, -0.05, -0.02);

        // 4 Wrapped Fingers
        for (let f = 0; f < 4; f++) {
          const finger = new THREE.Mesh(new THREE.BoxGeometry(0.068, 0.018, 0.02), this.matSkin);
          finger.position.set(-0.015, -0.035 - f * 0.018, -0.055);
          this.rightArm.add(finger);
        }

        this.rightArm.add(rSleeve, rWrist, rPalm);
        this.weaponPivot.add(this.rightArm);

        // Left Support Arm + Gloved Hand (Holds rifle forend or assists bandage/food)
        this.leftArm = new THREE.Group();
        const lSleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.064, 0.42, 10), this.matSleeve);
        lSleeve.rotation.set(Math.PI / 2.4, 0, -0.45);
        lSleeve.position.set(-0.34, -0.16, 0.05);

        const lWrist = new THREE.Mesh(new THREE.CylinderGeometry(0.044, 0.05, 0.15, 10), this.matSkin);
        lWrist.rotation.set(Math.PI / 2.3, 0, -0.42);
        lWrist.position.set(-0.2, -0.09, -0.14);

        const lHand = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.075, 0.09), this.matGlove);
        lHand.position.set(-0.12, -0.04, -0.24);

        this.leftArm.add(lSleeve, lWrist, lHand);
        this.weaponPivot.add(this.leftArm);
      }

      setEquippedModel(item) {
        if (this.itemMesh) {
          this.weaponPivot.remove(this.itemMesh);
          this.itemMesh = null;
        }
        this.leftArm.visible = false;

        if (!item) return;

        const g = new THREE.Group();
        const customMat = new THREE.MeshStandardMaterial({
          color: item.color || 0x475569,
          metalness: 0.78,
          roughness: 0.32
        });

        if (item.type === 'gun') {
          const isRifle = ['ar', 'ak', 'dmr', 'sniper', 'lmg', 'shotgun', 'railgun', 'smg'].includes(item.gunClass);
          this.leftArm.visible = isRifle;

          // Receiver
          const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.068, 0.11, isRifle ? 0.36 : 0.24), customMat);
          receiver.position.set(0, 0.03, -0.06);
          g.add(receiver);

          // Pistol Grip
          const grip = new THREE.Mesh(new THREE.BoxGeometry(0.058, 0.13, 0.065), this.matGunWood);
          grip.position.set(0, -0.05, 0.04);
          grip.rotation.x = 0.25;
          g.add(grip);

          // Barrel & Muzzle
          const barrelLen = item.gunClass === 'sniper' ? 0.56 : isRifle ? 0.38 : 0.18;
          const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.016, barrelLen, 10), this.matGunMetal);
          barrel.rotation.x = Math.PI / 2;
          barrel.position.set(0, 0.055, -0.18 - barrelLen / 2);
          g.add(barrel);

          if (isRifle) {
            // Wooden / Tactical Handguard & Buttstock
            const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.062, 0.075, 0.24), item.gunClass === 'ak' || item.gunClass === 'shotgun' ? this.matGunWood : this.matGunMetal);
            handguard.position.set(0, 0.035, -0.28);
            g.add(handguard);

            const stock = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.1, 0.22), this.matGunWood);
            stock.position.set(0, 0.01, 0.19);
            g.add(stock);

            // Magazine
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.17, 0.075), this.matGunMetal);
            mag.position.set(0, -0.08, -0.12);
            mag.rotation.x = -0.22;
            g.add(mag);
          }

          // Scope / Holo Sight
          if (['sniper', 'dmr', 'ar', 'railgun'].includes(item.gunClass)) {
            const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.18, 12), this.matGunMetal);
            scope.rotation.x = Math.PI / 2;
            scope.position.set(0, 0.115, -0.05);
            const lens = new THREE.Mesh(new THREE.CircleGeometry(0.02, 12), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
            lens.position.set(0, 0.115, 0.041);
            g.add(scope, lens);
          }

          this.muzzleFlash.position.set(0, 0.055, -0.2 - barrelLen);
          this.muzzleLight.position.copy(this.muzzleFlash.position);
        } else if (item.type === 'tool' || item.type === 'melee') {
          // Rust Stone/Metal Hatchet or Sword
          const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.026, 0.56, 8), this.matGunWood);
          handle.position.set(0, 0.12, -0.05);
          handle.rotation.x = -0.18;
          g.add(handle);

          // Leather Rope Binding
          const wrap = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.08, 8), this.matGlove);
          wrap.position.set(0, 0.32, -0.09);
          wrap.rotation.x = -0.18;
          g.add(wrap);

          if (item.type === 'melee') {
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.52, 0.065), customMat);
            blade.position.set(0, 0.52, -0.13);
            blade.rotation.x = -0.18;
            g.add(blade);
          } else {
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.12, 0.26), customMat);
            head.position.set(0, 0.34, -0.14);
            head.rotation.x = -0.18;
            g.add(head);
          }
        } else if (item.type === 'consumable') {
          this.leftArm.visible = true;
          // Medical Syringe / Bandage Roll / Food Can
          const medBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.045, 0.045, 0.16, 12),
            new THREE.MeshStandardMaterial({ color: item.id.includes('water') ? 0x0284c7 : item.id.includes('meat') ? 0x9a3412 : 0x16a34a, roughness: 0.4 })
          );
          medBody.position.set(-0.04, 0.02, -0.12);
          g.add(medBody);
        } else if (item.type === 'building') {
          // Rolled Rust Building Blueprint
          const bp = new THREE.Mesh(
            new THREE.CylinderGeometry(0.042, 0.042, 0.34, 12),
            new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.7 })
          );
          bp.rotation.x = Math.PI / 2.4;
          bp.position.set(0, 0.02, -0.14);
          g.add(bp);
        }

        this.itemMesh = g;
        this.weaponPivot.add(g);
      }

      triggerRecoil(isGun = true) {
        if (isGun) {
          this.weaponPivot.position.z = -0.34;
          this.weaponPivot.rotation.x = 0.14;
          this.muzzleFlash.visible = true;
          this.muzzleFlash.rotation.z = Math.random() * Math.PI;
          this.muzzleLight.intensity = 4.5;
          setTimeout(() => {
            this.muzzleFlash.visible = false;
            this.muzzleLight.intensity = 0;
          }, 55);
        }
      }

      update(dt, isADS, swingProgress, moveSpeed, time) {
        const targetX = isADS ? 0.0 : 0.28;
        const targetY = isADS ? -0.185 : -0.25;
        const targetZ = isADS ? -0.36 : -0.45;

        const bobX = moveSpeed > 0.3 && !isADS ? Math.cos(time * 9) * 0.012 : 0;
        const bobY = moveSpeed > 0.3 && !isADS ? Math.abs(Math.sin(time * 9)) * 0.014 : Math.sin(time * 2) * 0.004;

        this.weaponPivot.position.x += (targetX + bobX - this.weaponPivot.position.x) * Math.min(1, dt * 16);
        this.weaponPivot.position.y += (targetY + bobY - this.weaponPivot.position.y) * Math.min(1, dt * 16);
        this.weaponPivot.position.z += (targetZ - this.weaponPivot.position.z) * Math.min(1, dt * 16);

        if (swingProgress > 0) {
          const arc = Math.sin(swingProgress * Math.PI) * 1.25;
          this.weaponPivot.rotation.x = -arc;
          this.weaponPivot.rotation.z = arc * 0.25;
        } else {
          this.weaponPivot.rotation.x += (0 - this.weaponPivot.rotation.x) * Math.min(1, dt * 14);
          this.weaponPivot.rotation.z += (0 - this.weaponPivot.rotation.z) * Math.min(1, dt * 14);
        }
      }
    }
